<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CRM для кондитерской «Юг Сладости»">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Юг Сладости">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#c96a4b">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Юг Сладости — CRM</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Safari на iPhone при показе клавиатуры прокручивает страницу, чтобы поле ввода было
    над ней, и в режиме "на экране Домой" часто не возвращает прокрутку назад. Flutter
    рисует всё сам и прокрутку страницы не ожидает: картинка остаётся на месте, а касания
    сдвигаются — нажатие по товару в списке выбирало соседний. Держим страницу в нуле.
  -->
  <script>
    (function () {
      function pin() {
        if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
      }
      window.addEventListener('scroll', pin, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', pin);
        window.visualViewport.addEventListener('scroll', pin);
      }
      document.addEventListener('focusout', function () { setTimeout(pin, 100); });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
