services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data

volumes:
  crm-postgres-data:
