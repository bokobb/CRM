<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Контрагенты — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Контрагенты</h1><p class="subtitle">Поставщики сырья — выбираются в поле "Поставщик" при оформлении закупки.
                Новый контрагент сразу создаётся и в 1С; удаление (если на него ещё нет закупок) там же помечается на удаление.</p></div>
            <form th:action="@{/counterparties/sync-1c}" method="post">
                <button class="btn" type="submit">Загрузить из 1С</button>
            </form>
        </div>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <div class="alert success" th:if="${success}" th:text="${success}"></div>

        <form class="panel" th:action="@{/counterparties}" method="post" style="max-width:420px;display:flex;gap:8px;align-items:flex-end">
            <div class="field" style="flex:1;margin:0">
                <label>Новый контрагент</label>
                <input type="text" name="name" required>
            </div>
            <button class="btn primary" type="submit">Добавить</button>
        </form>

        <input type="text" id="crm-counterparty-search" class="product-search"
               placeholder="Поиск по названию…" oninput="crmFilterCounterparties()"
               th:if="${not #lists.isEmpty(counterparties)}">

        <div class="panel">
            <table th:if="${not #lists.isEmpty(counterparties)}">
                <tr><th>Название</th><th>1С</th><th></th></tr>
                <tr th:each="c : ${counterparties}" th:attr="data-name=${#strings.toLowerCase(c.name)}">
                    <td th:text="${c.name}"></td>
                    <td>
                        <span th:if="${c.oneCContragentKey != null}" style="color:#4C8A5E">привязан</span>
                        <span th:if="${c.oneCContragentKey == null and c.oneCSyncError != null}"
                              style="color:#B8433F" th:title="${c.oneCSyncError}">ошибка</span>
                        <span th:if="${c.oneCContragentKey == null and c.oneCSyncError == null}" class="subtitle">—</span>
                    </td>
                    <td class="actions">
                        <form th:action="@{/counterparties/{id}/delete(id=${c.id})}" method="post"
                              onsubmit="return confirm('Удалить контрагента?');">
                            <button class="btn small danger" type="submit">Удалить</button>
                        </form>
                    </td>
                </tr>
            </table>
            <p class="empty" th:if="${#lists.isEmpty(counterparties)}">Контрагентов пока нет</p>
            <p class="empty" id="crm-counterparty-empty" style="display:none">Ничего не найдено</p>
        </div>
    </main>
</div>
<script th:inline="none">
    function crmFilterCounterparties() {
        var q = document.getElementById('crm-counterparty-search').value.trim().toLowerCase();
        var rows = document.querySelectorAll('table tr[data-name]');
        var visible = 0;
        rows.forEach(function (row) {
            var match = row.getAttribute('data-name').indexOf(q) !== -1;
            row.style.display = match ? '' : 'none';
            if (match) visible++;
        });
        document.getElementById('crm-counterparty-empty').style.display = visible === 0 ? '' : 'none';
    }
</script>
</body>
</html>
