<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Заказ онлайн — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<div class="login-card">
    <div class="brand"><img th:src="@{/images/logo.png}" alt="Логотип"> Юг Сладости</div>
    <p class="subtitle">Выберите товары и оформите заказ онлайн</p>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/shop/start}" method="post">
        <div class="field">
            <label for="phone">Ваш номер телефона</label>
            <input type="tel" id="phone" name="phone" placeholder="+7 700 000 00 00" autofocus required>
        </div>
        <div class="field">
            <label for="name">Ваше имя (если заказываете впервые)</label>
            <input type="text" id="name" name="name" placeholder="Как к вам обращаться">
        </div>
        <button class="btn primary" type="submit">Продолжить</button>
    </form>
</div>
</body>
</html>
