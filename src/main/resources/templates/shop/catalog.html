<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Ваш заказ — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/turbo.min.js}"></script>
    <script th:src="@{/js/btn-animate.js}"></script>
</head>
<body>
<div class="shop-page">
    <header class="shop-topbar">
        <div class="brand"><img th:src="@{/images/logo.png}" alt="Логотип"> Юг Сладости</div>
        <div class="shop-topbar-right">
            <form th:action="@{/shop/reset}" method="post" data-turbo="false">
                <button class="btn small" type="submit">Сменить номер</button>
            </form>
        </div>
    </header>

    <main class="shop-content">
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <div class="shop-title" id="shopTitle" th:text="${headerLabel}"></div>

        <div id="shopRows">
            <div class="shop-row" th:each="row : ${rows}" th:attr="data-row-id=${row.product().id}">
                <img th:if="${row.product().imageUrl != null}" th:src="${row.product().imageUrl}" alt="" class="shop-avatar">
                <div th:unless="${row.product().imageUrl != null}" class="shop-avatar shop-avatar-placeholder"
                     th:text="${#strings.substring(row.product().name, 0, 1)}"></div>
                <div class="shop-row-body">
                    <div class="shop-row-top">
                        <div class="shop-row-name" th:text="${row.product().name}"></div>
                        <form class="shop-step-form" data-turbo="false" th:action="@{/shop/cart/item/{id}/remove(id=${row.product().id})}" method="post">
                            <button class="shop-row-remove" type="submit">×</button>
                        </form>
                    </div>
                    <div class="shop-row-bottom">
                        <div class="shop-row-price" th:text="${row.priceLabel()}"></div>
                        <div class="shop-stepper">
                            <form class="shop-step-form" data-turbo="false" th:action="@{/shop/cart/item/{id}/dec(id=${row.product().id})}" method="post">
                                <button type="submit">−</button>
                            </form>
                            <input type="text" inputmode="decimal" class="qty qty-input" th:value="${row.qtyLabel()}">
                            <form class="shop-step-form" data-turbo="false" th:action="@{/shop/cart/item/{id}/inc(id=${row.product().id})}" method="post">
                                <button type="submit">+</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="empty" id="shopEmpty" th:if="${#lists.isEmpty(rows)}">Пока пусто — загляните на главную и добавьте товары</div>
    </main>

    <div class="shop-bottom-area">
        <div class="shop-bottom-bar" id="shopBottomBar">
            <form th:if="${canOrder}" th:action="@{/shop/cart/submit}" method="post" data-turbo="false">
                <button class="btn primary" type="submit" th:text="${bottomButtonLabel}"></button>
            </form>
        </div>
        <div th:replace="~{shop/fragments/bottom-nav :: bottomnav(active='cart', cartCount=${cartCount})}"></div>
    </div>
</div>

<script th:inline="javascript">
    // См. products.html — весь код навешан на "turbo:load", а не выполняется один раз при
    // разборе скрипта, иначе после Turbo-перехода (без полной перезагрузки страницы)
    // степперы и поле количества переставали бы отвечать на клики.
    document.addEventListener('turbo:load', function () {
        var submitUrl = /*[[@{/shop/cart/submit}]]*/ '/shop/cart/submit';

        function bindStepForms(root) {
            root.querySelectorAll('.shop-step-form').forEach(function (form) {
                form.addEventListener('submit', onStepSubmit);
            });
        }

        function onStepSubmit(e) {
            e.preventDefault();
            var form = e.currentTarget;
            fetch(form.action, {method: 'POST', headers: {'X-Requested-With': 'fetch'}})
                .then(function (res) {
                    if (!res.ok) throw new Error('bad status');
                    return res.json();
                })
                .then(applyUpdate)
                .catch(function () {
                    window.location.reload();
                });
        }

        function applyUpdate(data) {
            document.getElementById('shopTitle').textContent = data.headerLabel;

            var row = document.querySelector('[data-row-id="' + data.productId + '"]');
            if (data.removed) {
                if (row) row.remove();
                if (data.empty) {
                    var rows = document.getElementById('shopRows');
                    if (!document.getElementById('shopEmpty')) {
                        var div = document.createElement('div');
                        div.className = 'empty';
                        div.id = 'shopEmpty';
                        div.textContent = 'Пока пусто — добавьте товары';
                        rows.after(div);
                    }
                }
            } else if (row) {
                row.querySelector('.qty').value = data.qtyLabel;
            }

            var bar = document.getElementById('shopBottomBar');
            if (data.canOrder) {
                bar.innerHTML = '<form method="post" data-turbo="false" action="' + submitUrl + '">' +
                    '<button class="btn primary" type="submit"></button></form>';
                bar.querySelector('button').textContent = data.bottomButtonLabel;
            } else {
                bar.innerHTML = '';
            }
        }

        // Прямой ввод количества цифрами (тап по числу в степпере строки корзины) — без
        // этого оптовый заказ на сотни/тысячи штук означал бы сотни тапов по +.
        function bindQtyInputs(root) {
            root.querySelectorAll('.qty-input').forEach(function (input) {
                input.addEventListener('focus', function () { input.select(); });
                input.addEventListener('keydown', function (e) { if (e.key === 'Enter') input.blur(); });
                input.addEventListener('change', onQtyChange);
            });
        }

        function onQtyChange(e) {
            var input = e.currentTarget;
            var row = input.closest('[data-row-id]');
            if (!row) return;
            var productId = row.getAttribute('data-row-id');
            var value = parseFloat(input.value.replace(',', '.').replace(/\s/g, ''));
            if (!isFinite(value) || value <= 0) {
                window.location.reload();
                return;
            }
            fetch('/shop/cart/item/' + productId + '/set', {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'fetch',
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: 'qty=' + encodeURIComponent(value)
            })
                .then(function (res) {
                    if (!res.ok) throw new Error('bad status');
                    return res.json();
                })
                .then(applyUpdate)
                .catch(function () {
                    window.location.reload();
                });
        }

        bindStepForms(document);
        bindQtyInputs(document);
    });
</script>
</body>
</html>
