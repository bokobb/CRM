<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title th:text="${product.name} + ' — Юг Сладости'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="shop-page">
    <div class="shop-hero">
        <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" alt="" class="shop-hero-img">
        <div th:unless="${product.imageUrl != null}" class="shop-hero-img shop-hero-placeholder"
             th:text="${#strings.substring(product.name, 0, 1)}"></div>

        <a th:href="@{/shop/products}" class="shop-hero-close">×</a>

        <div class="shop-hero-stepper">
            <button type="button" id="stepMinus">−</button>
            <input type="text" inputmode="decimal" class="qty qty-input" id="qtyLabel" th:value="${qtyLabel}">
            <button type="button" id="stepPlus">+</button>
        </div>
    </div>

    <main class="shop-detail-body">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <div class="shop-detail-name" th:text="${product.name}"></div>
            <span class="shop-category-badge" th:if="${product.category != null and !product.category.isBlank()}"
                  th:text="${product.category}"></span>
        </div>
        <div class="shop-detail-price" th:text="${priceLabel}"></div>
        <p class="shop-detail-desc" th:if="${product.description != null and !product.description.isBlank()}"
           th:text="${product.description}"></p>
    </main>

    <div class="shop-bottom-bar">
        <form th:action="@{/shop/products/{id}/add(id=${product.id})}" method="post">
            <input type="hidden" name="qty" id="qtyInput" th:value="${qty}">
            <button class="btn primary" type="submit" id="addButton" th:text="${addButtonLabel}"></button>
        </form>
    </div>
</div>

<script th:inline="javascript">
    (function () {
        var price = parseFloat(/*[[${priceRaw}]]*/ '0');
        var step = parseFloat(/*[[${stepRaw}]]*/ '1');
        var qty = parseFloat(/*[[${qty}]]*/ '1');
        var prefix = /*[[${addLabelPrefix}]]*/ 'Добавить за ';
        var decimals = step < 1 ? 1 : 0;

        var qtyLabelEl = document.getElementById('qtyLabel');
        var qtyInputEl = document.getElementById('qtyInput');
        var addButtonEl = document.getElementById('addButton');

        var qtyFmt = new Intl.NumberFormat('ru-RU', {minimumFractionDigits: 0, maximumFractionDigits: decimals});
        var moneyFmt = new Intl.NumberFormat('ru-RU', {minimumFractionDigits: 0, maximumFractionDigits: 2});

        function render() {
            qtyLabelEl.value = qtyFmt.format(qty);
            qtyInputEl.value = qty.toFixed(decimals);
            addButtonEl.textContent = prefix + moneyFmt.format(qty * price) + ' ₸';
        }

        document.getElementById('stepMinus').addEventListener('click', function () {
            qty = Math.max(step, qty - step);
            render();
        });
        document.getElementById('stepPlus').addEventListener('click', function () {
            qty = qty + step;
            render();
        });

        // Прямой ввод количества цифрами — без этого оптовый заказ на сотни/тысячи штук
        // означал бы сотни тапов по +.
        qtyLabelEl.addEventListener('focus', function () {
            qtyLabelEl.select();
        });
        qtyLabelEl.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') qtyLabelEl.blur();
        });
        qtyLabelEl.addEventListener('change', function () {
            var parsed = parseFloat(qtyLabelEl.value.replace(',', '.').replace(/\s/g, ''));
            qty = (!isFinite(parsed) || parsed < step) ? step : parsed;
            render();
        });
    })();
</script>
</body>
</html>
