<!DOCTYPE html>
<!--/* Общие куски магазина /shop (вёрстка из артефакта «Онлайн-заказ», 09.10): <head> со стилями,
     шапка с разделами и подвал. Цвета и шрифты — как у рекламной страницы (templates/promo.html). */-->
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title th:text="${title} + ' — ' + (${company.name} ?: 'Юг Сладости')">Онлайн-заказ</title>
    <th:block th:if="${seo != null}">
    <meta name="description" th:content="${seo.description}">
    <link rel="canonical" th:href="${seo.canonical}">
    <meta name="robots" th:content="${seo.noindex} ? 'noindex, follow' : 'index, follow'">
    <meta property="og:type" content="website"><meta property="og:locale" content="ru_RU"><meta property="og:site_name" content="Юг Сладости">
    <meta property="og:title" th:content="${seo.title}"><meta property="og:description" th:content="${seo.description}">
    <meta property="og:url" th:content="${seo.canonical}"><meta property="og:image" th:content="${seo.ogImage}">
    <script type="application/ld+json" th:if="${seo.jsonLd != null}" th:utext="${seo.jsonLd}"></script>
    </th:block>
    <th:block th:replace="~{site/frame :: icons}"></th:block>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,500;0,700;0,800;1,500;1,600&amp;family=Golos+Text:wght@400;500;600;700&amp;family=Marck+Script&amp;display=swap">
    <link rel="stylesheet" href="/promo/album.css">
    <script src="/promo/album.js" defer></script>
    <style>
        /* Layout: the promo site's catalogue look carried into the shop. A yolk header holds the three sections
           (products, cart, order history); each section is a list on the left with a paper panel pinned on the right
           (under the list on a phone, where the total moves into a bottom bar). One light theme by design: the brand's printed colours. */
        :root{
          --yolk:#FFC646; --yolk-deep:#EDAE25; --crimson:#B9203C; --crimson-deep:#96172E;
          --cream:#FFF6DA; --paper:#F3F2E9; --white:#FFFFFF; --ink:#2A1712; --ink-soft:#6B564B;
          --line:rgba(42,23,18,.14); --line-strong:rgba(42,23,18,.34); --field:#8A776C; --slip:#FFF4DA;
          --ok-bg:#DDF0E3; --ok-fg:#14532D; --work-fg:#6A4A00; --work-line:#E3C36A; --closed-bg:#E7E3D8; --closed-fg:#4A3B33; --off-bg:#F9DEE3;
          --font-display:"Vollkorn","PT Serif",Georgia,"Times New Roman",serif;
          --font-body:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
          --gutter:clamp(16px,4vw,40px);
        }
        *,*::before,*::after{box-sizing:border-box}
        body{margin:0;background:var(--white);color:var(--ink);font:400 17px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
        img{max-width:100%;height:auto;display:block}
        [hidden]{display:none!important}
        a{color:inherit}
        h1,h2,h3{font-family:var(--font-display);font-variant-numeric:lining-nums;margin:0;text-wrap:balance;letter-spacing:-.01em}
        p{margin:0}
        button,input,select,textarea{font:inherit;color:inherit}
        :focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
        [tabindex="-1"]:focus{outline:none}
        .wrap{max-width:calc(1200px + 2*var(--gutter));margin-inline:auto;padding-inline:var(--gutter)}
        .eyebrow{font:italic 600 19px/1.2 var(--font-display);color:var(--crimson-deep)}
        /* the footer stays at the bottom of the window on short screens */
        .page{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
        main{flex:1 0 auto;display:flex;flex-direction:column;overflow-x:clip}
        main>.wrap{width:100%}

        /* buttons — same as the promo site */
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border:2px solid transparent;border-radius:999px;font:600 16px/1 var(--font-body);text-decoration:none;white-space:nowrap;cursor:pointer;transition:transform .15s,box-shadow .15s,background-color .15s}
        .btn svg{flex:none}
        .btn-primary{background:var(--crimson);color:#fff;box-shadow:0 5px 0 var(--crimson-deep)}
        .btn-primary:hover{transform:translateY(2px);box-shadow:0 3px 0 var(--crimson-deep)}
        .btn-line{background:transparent;border-color:var(--ink);color:var(--ink)}
        .btn-line:hover{background:var(--ink);color:#fff}
        .btn-sm{min-height:46px;padding:0 20px;font-size:15px}
        .btn:disabled{background:#D9D2C8;color:#6B564B;box-shadow:0 5px 0 #BFB6AA;cursor:not-allowed;transform:none}
        .link{display:inline-flex;align-items:center;min-height:44px;padding:0;border:0;background:none;color:var(--crimson-deep);font:600 15px/1.2 var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

        /* shared bits from the promo */
        .spec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 0;margin:0}
        .spec>div{padding-left:14px;border-left:1px solid var(--line-strong)}
        .spec>div:nth-child(odd){padding-left:0;border-left:0}
        .spec dt{font-size:12px;line-height:1.25;font-weight:600;color:var(--crimson-deep)}
        .spec dd{margin:3px 0 0;font-size:15.5px;line-height:1.25;font-weight:600;font-variant-numeric:tabular-nums}
        .frame{position:relative;background:var(--cream);padding:10px;box-shadow:0 22px 30px -22px rgba(80,40,0,.55)}
        .frame img{width:100%;aspect-ratio:3/4;object-fit:cover}
        .frame::before,.frame::after{content:"";position:absolute;width:34%;height:8%;background:rgba(255,241,196,.78);box-shadow:0 1px 2px rgba(80,40,0,.14);transform:rotate(-38deg)}
        .frame::before{left:-12%;top:-1%}
        .frame::after{right:-12%;bottom:-1%}
        .wheat{position:absolute;aspect-ratio:.9;background:currentColor;-webkit-mask:url(/promo/img/wheat.webp) center/contain no-repeat;mask:url(/promo/img/wheat.webp) center/contain no-repeat;pointer-events:none}
        .art-cut{position:absolute;height:auto;filter:drop-shadow(0 14px 12px rgba(80,40,0,.32))}
        .field{display:grid;gap:6px}
        .field label,.field-label{font-size:14px;font-weight:600}
        .field input,.field textarea{width:100%;min-height:54px;padding:0 16px;border-radius:14px;border:1.5px solid var(--field);background:var(--white);color:var(--ink);font:400 16px/1.3 var(--font-body)}
        .field textarea{padding:14px 16px;resize:vertical}
        .field input:focus-visible,.field textarea:focus-visible,.search input:focus-visible{outline:3px solid var(--crimson);outline-offset:2px;border-radius:14px}
        .field-err{font-size:14px;line-height:1.35;color:var(--crimson-deep);font-weight:600}
        .hint{font-size:14px;line-height:1.4;color:var(--ink-soft)}

        /* header with the three sections */
        .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--yolk);border-bottom:1px solid rgba(42,23,18,.12)}
        .top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:80px}
        .brand{display:flex;align-items:center;gap:14px;min-width:0;text-decoration:none}
        .brand img{flex:none;height:62px;width:auto}
        .brand span{min-width:0;overflow:hidden;text-overflow:ellipsis;font:700 21px/1.4 var(--font-display);white-space:nowrap}
        .tabs{display:flex;gap:4px}
        .tabs button,.tabs .tab-link{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border:0;border-radius:999px;background:none;color:var(--ink);font:600 15.5px/1 var(--font-body);white-space:nowrap;cursor:pointer}
        .tabs .tab-link:hover,.tabs button:hover{background:rgba(255,255,255,.55)}
        .tabs .tab-link[aria-current="page"],.tabs button[aria-current="page"]{background:var(--ink);color:#fff}
        .t-short{display:none}
        .badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--crimson);color:#fff;font:700 12.5px/1 var(--font-body);font-variant-numeric:tabular-nums}
        .tabs .tab-link[aria-current="page"] .badge,.tabs button[aria-current="page"] .badge{background:var(--white);color:var(--ink)}
        .top-side{display:flex;align-items:center;gap:18px;font-size:15px}
        .top-side a{display:inline-flex;align-items:center;min-height:44px;font-weight:500;text-decoration:none;white-space:nowrap}
        .top-side a:hover{text-decoration:underline}
        .help{white-space:nowrap}
        .help b{font-weight:600}
        .user{display:flex;align-items:center;gap:12px;white-space:nowrap}
        .user b{max-width:14ch;overflow:hidden;text-overflow:ellipsis;font-weight:600}
        .user .link{color:var(--ink)}

        /* sign-in */
        .signin{flex:1 0 auto;position:relative;overflow:hidden;overflow:clip;background:var(--yolk)}
        .signin-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);align-items:center;gap:clamp(28px,5vw,72px);padding-block:clamp(24px,4vw,56px) clamp(48px,7vw,96px)}
        .panel{display:grid;gap:18px;padding:clamp(22px,3.4vw,40px);border-radius:28px;background:var(--white);box-shadow:0 26px 40px -30px rgba(80,40,0,.5)}
        .panel h1{font-weight:800;font-size:clamp(30px,3.8vw,46px);line-height:1.06}
        .panel .btn{width:100%}
        .art{position:relative;width:min(100%,480px);aspect-ratio:1/1.04;margin-inline:auto}
        .art .wheat{right:-10%;top:-7%;width:64%;color:var(--ink);opacity:.2;transform:rotate(8deg)}
        .art .frame{position:absolute;left:21%;top:3%;width:58%;transform:rotate(-3deg)}
        .art-cut.c1{right:-7%;bottom:0;width:60%}
        .art-cut.c2{left:-8%;bottom:11%;width:43%}
        .art-cut.c3{left:0;top:4%;width:33%;rotate:-8deg}

        /* the three sections share one frame: list + side panel */
        .flow{display:grid;grid-template-columns:minmax(0,1fr) 372px;align-items:start;gap:clamp(24px,3.5vw,52px);padding-block:clamp(24px,3.6vw,44px) clamp(56px,8vw,96px)}
        .flow.is-solo{grid-template-columns:minmax(0,1fr)}
        .flow-main{min-width:0;container:list / inline-size}
        .step-head{display:grid;gap:8px;margin-bottom:22px}
        .step-head h1{font-weight:800;font-size:clamp(30px,3.8vw,46px);line-height:1.06}
        .lead{color:var(--ink-soft);max-width:38rem}
        .tools{display:grid;gap:12px;margin-bottom:10px}
        .search{position:relative}
        .search svg{position:absolute;left:18px;top:50%;translate:0 -50%;color:var(--ink-soft);pointer-events:none}
        .search input{width:100%;height:52px;padding:0 18px 0 48px;border-radius:999px;border:1.5px solid var(--field);background:var(--white);font:400 16px/1.2 var(--font-body)}
        .chips{display:flex;flex-wrap:wrap;gap:6px}
        .chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--white);font:500 13.5px/1 var(--font-body);white-space:nowrap;cursor:pointer}
        .chip span{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
        .chip:hover{border-color:var(--ink)}
        .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
        .chip[aria-pressed="true"] span{color:rgba(255,255,255,.75)}

        /* a product row: wraps by itself when the column gets narrow, no breakpoints */
        .items{margin:0;padding:0;list-style:none}
        .item{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:flex-start;gap:16px;padding:14px 12px;border-radius:18px}
        /* колосок на фоне карточки — как на рекламной странице (templates/promo.html, .wheat) */
        .item::after{content:"";position:absolute;z-index:-1;right:-24px;bottom:-56px;width:240px;aspect-ratio:.9;background:#D9A21C;opacity:.6;-webkit-mask:url(/promo/img/wheat.webp) center/contain no-repeat;mask:url(/promo/img/wheat.webp) center/contain no-repeat;transform:rotate(-14deg);pointer-events:none}
        .item::before{content:"";display:none;position:absolute;left:12px;right:12px;top:0;height:1px;background:var(--line)}
        .item:not([hidden])~.item:not([hidden])::before{display:block}
        #items .item[data-on="true"]{background:var(--cream)}
        #items .item[data-on="true"]::before,#items .item[data-on="true"]+.item::before{display:none}
        /* фото товара 3:4 — кнопка альбома; скотч на рамке, а ::before/::after самой кнопки — стопка снимков (static/promo/album.css) */
        .item-pic{position:relative;display:block;flex:none;width:112px;padding:0;border:0;background:none;font:inherit;color:inherit}
        button.item-pic:focus-visible{outline-offset:4px}
        .item-frame{position:relative;display:block;padding:5px;background:var(--cream);box-shadow:0 12px 14px -12px rgba(80,40,0,.5);transition:transform .2s}
        button.item-pic:hover .item-frame{transform:translateY(-2px)}
        /* скотч на фото — левый верхний и правый нижний угол, как на карточках рекламной страницы */
        .item-frame::before,.item-frame::after{content:"";position:absolute;z-index:1;width:40%;height:9%;background:rgba(255,241,196,.85);box-shadow:0 1px 2px rgba(80,40,0,.14);transform:rotate(-38deg);pointer-events:none}
        .item-frame::before{left:-10%;top:1%}
        .item-frame::after{right:-10%;bottom:1%}
        #items .item[data-on="true"] .item-frame{background:var(--white)}
        /* фото целиком на белом — старые квадратные не обрезаются */
        .item-frame img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff}
        .item-frame .noimg{padding:18%;opacity:.35;background:none}
        .item-body{flex:1 1 0;min-width:0;align-self:center;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
        .item-info{flex:1 1 210px;min-width:0}
        .item h3{font-weight:700;font-size:17px;line-height:1.15;color:var(--crimson)}
        .item-meta{margin-top:4px;font-size:13px;line-height:1.3;color:var(--ink-soft)}
        .item-line{margin-top:4px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
        .item-buy{flex:0 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
        .price{min-width:72px;margin-right:auto}
        .price b{display:block;font-weight:700;font-size:16px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
        .price span{font-size:12px;color:var(--ink-soft);white-space:nowrap}
        .qty{display:inline-flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:999px;background:var(--white)}
        .qty button{display:grid;place-items:center;width:38px;height:38px;padding:0;border:0;border-radius:50%;background:none;color:var(--ink);cursor:pointer}
        .qty button:last-child{background:var(--crimson);color:#fff}
        .qty button:disabled{color:#A99C92;cursor:default}
        .qty input{width:40px;height:38px;padding:0;border:0;background:none;text-align:center;font:600 15px/1 var(--font-body);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
        .qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
        .boxbtn{min-height:38px;padding:0 12px;border-radius:999px;border:1.5px dashed var(--line-strong);background:rgba(255,255,255,.7);font:500 13px/1.1 var(--font-body);font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
        .boxbtn:hover{border-style:solid;border-color:var(--ink)}
        /* cart rows: the remove button sits in the corner; in a wide column it moves to the middle of the right edge.
           When the controls drop to their own line they take its full width, so the stepper lines up under the remove button. */
        .item--cart .item-info{flex-grow:999;padding-right:40px}
        .item--cart .item-buy{flex-grow:1}
        .rm{position:absolute;top:8px;right:6px;display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:none;color:var(--ink-soft);cursor:pointer}
        .rm:hover{background:var(--cream);color:var(--crimson)}
        @container list (min-width:640px){
          .item--cart{padding-right:66px}
          .item--cart .item-info{padding-right:0}
          .item--cart .rm{top:50%;right:8px;translate:0 -50%}
        }
        .none{display:grid;gap:10px;justify-items:start;padding:28px 0;color:var(--ink-soft)}
        .empty{display:grid;gap:14px;justify-items:start;padding:clamp(22px,3vw,34px);border-radius:26px;background:var(--cream)}
        .empty h2{font-weight:800;font-size:26px;line-height:1.1}
        .actions{display:flex;flex-wrap:wrap;gap:10px}

        /* cart: composition, pickup time, payment */
        .block{display:grid;gap:12px;padding:22px 0;border-top:1px solid var(--line)}
        .block:first-child{border-top:0;padding-top:0}
        .block h2{font-weight:700;font-size:22px;line-height:1.15}
        #pick{scroll-margin-top:96px}
        .days{display:flex;flex-wrap:wrap;gap:8px}
        .day{display:grid;align-content:center;gap:2px;min-width:104px;min-height:58px;padding:6px 16px;border-radius:16px;border:1.5px solid var(--line-strong);background:var(--white);font:600 15px/1.2 var(--font-body);text-align:left;cursor:pointer}
        .day small{font-weight:400;font-size:12.5px;color:var(--ink-soft)}
        .day:hover{border-color:var(--ink)}
        .day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
        .day[aria-pressed="true"] small{color:rgba(255,255,255,.78)}
        .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
        .slot{display:grid;align-content:center;gap:1px;min-height:54px;padding:4px 10px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--white);font:600 15px/1.2 var(--font-body);font-variant-numeric:tabular-nums;cursor:pointer}
        .slot small{font-weight:400;font-size:12px}
        .slot:hover{border-color:var(--ink)}
        .slot[aria-pressed="true"]{background:var(--crimson);border-color:var(--crimson);color:#fff}
        .slot:disabled{border-style:dashed;background:var(--paper);color:var(--ink-soft);cursor:not-allowed}
        .block h2 .opt{margin-left:6px;font:400 13px/1 var(--font-body);color:var(--ink-soft);letter-spacing:0;text-transform:none}
        .choices{display:flex;flex-wrap:wrap;gap:8px}
        .choice{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 18px 0 14px;border-radius:16px;border:1.5px solid var(--line-strong);background:var(--white);font-weight:500;cursor:pointer}
        .choice input{width:20px;height:20px;margin:0;accent-color:var(--crimson)}
        .choice:has(input:checked){border-color:var(--crimson);background:var(--cream)}

        /* side panel: cart summary, or help on the history page */
        .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);display:grid;gap:14px;padding:22px;border-radius:26px;background:var(--paper)}
        .side h2{font-weight:800;font-size:26px;line-height:1.1}
        .side-note{font-size:15px;line-height:1.45;color:var(--ink-soft)}
        .side-lines{display:grid;gap:10px;max-height:264px;margin:0;padding:0;overflow:auto;list-style:none}
        .side-lines li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;font-size:15px;line-height:1.3}
        .side-lines b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
        .side-lines small{grid-column:1/-1;font-size:13px;color:var(--ink-soft)}
        /* Итоги (корзина и история): слева позиций/коробок/вес, справа сумма; ниже возврат (если есть) и «Итого». */
        .totals{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 18px;padding-top:14px;border-top:1px solid var(--line-strong)}
        .totals dl{margin:0}
        .totals-left{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:6px 14px}
        .totals-left div{display:contents}
        .totals dt{font-size:12.5px;line-height:1.3;font-weight:600;color:var(--crimson-deep)}
        .totals dd{margin:0;font-size:15.5px;line-height:1.3;font-weight:600;font-variant-numeric:tabular-nums}
        .totals-right{align-self:start;padding-left:18px;border-left:1px solid var(--line-strong);text-align:right}
        .totals-right dd{margin-top:3px;font-size:18px;white-space:nowrap}
        .total-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0;padding-top:12px;border-top:1px solid var(--line-strong);font-size:15px}
        .total-line b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--crimson-deep)}
        .total-line + .sum{border-top:0;padding-top:4px}
        .side-when{display:grid;gap:2px;padding-top:12px;border-top:1px solid var(--line-strong);font-size:15px}
        .side-when span{font-size:12px;font-weight:600;color:var(--crimson-deep)}
        .side-when b{font-weight:600}
        .side-when b.is-none{font-weight:400;color:var(--ink-soft)}
        .sum{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line-strong)}
        .sum span{font-size:15px}
        .sum b{font:800 30px/1 var(--font-display);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
        .side .btn{width:100%}

        /* order history */
        .orders{display:grid;gap:16px;margin:18px 0 0;padding:0;list-style:none}
        .order-note{margin:12px 0 0}
        /* История заказов (ZADANIE-istoriya-zakazov.md): страница на бумаге, заказ — белая «накладная», справа — белая панель «Вопрос по заказу?» */
        .is-orders{background:var(--paper)}
        .is-orders .side{background:var(--white)}
        .ord .spec>div:not(:first-child){padding-left:14px;border-left:1px solid var(--line-strong)}
        /* ---- заказ: белая «накладная» ---- */
        .ord{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:clamp(18px,2.4vw,26px);border-radius:24px;background:var(--white);box-shadow:0 1px 0 rgba(42,23,18,.05),0 18px 34px -28px rgba(80,40,0,.5)}
        .ord>*{min-width:0}
        .ord-lines,.slip-body{overflow-x:auto}
        .ord[data-state="ready"]{box-shadow:inset 0 0 0 2px var(--yolk),0 18px 34px -28px rgba(80,40,0,.5)}
        .ord-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 16px}
        .ord-head h2{font-weight:800;font-size:clamp(23px,2.2vw,27px);line-height:1.1}
        .ord-meta{margin-top:5px;font-size:14.5px;line-height:1.4;color:var(--ink-soft)}
        .ord-meta b{font-weight:600;color:var(--ink)}

        /* ---- статус: маленький значок этапа — телефон с галочкой, планшет, коробка, фургон, галочка, крестик ---- */
        .st{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 11px;border-radius:999px;font:600 14px/1 var(--font-body);white-space:nowrap}
        .st .i{flex:none}
        .st--sent{background:var(--white);box-shadow:inset 0 0 0 1.5px var(--crimson);color:var(--crimson-deep)}
        .st--new{background:var(--cream);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
        .st--work{background:var(--cream);box-shadow:inset 0 0 0 1.5px var(--yolk-deep)}
        .st--ready{background:var(--yolk)}
        .st--done{background:#EEEADF}
        .st--off{background:#F6E3E5;color:var(--crimson-deep)}

        /* ---- дорожка заказа: круглые картинки на одной линии — 5 у заказа с сайта (с «Новая»), 4 у заказа от менеджера
           (с «Принят»); пройденное с красной галочкой, сегодняшний этап крупнее, жёлтый и движется, будущее бледное.
           --n — сколько этапов, --k — номер сегодняшнего этапа минус один ---- */
        .trk{--k:0;--n:4;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));margin:0;padding:0;list-style:none}
        .trk::before,.trk::after{content:"";position:absolute;top:44px;left:calc(50% / var(--n));height:3px;border-radius:3px;translate:0 -50%}
        .trk::before{right:calc(50% / var(--n));background:repeating-linear-gradient(90deg,var(--line-strong) 0 7px,transparent 7px 13px)}
        .trk::after{width:calc((100% - 100% / var(--n)) * var(--k) / (var(--n) - 1));background:var(--crimson)}
        .trk li{position:relative;display:grid;justify-items:center;align-content:start;gap:2px;padding-inline:4px;text-align:center}
        .stage-w{position:relative;z-index:1;display:grid;place-items:center;width:88px;height:88px;margin-bottom:6px}
        .stage{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:var(--cream);box-shadow:inset 0 0 0 2px rgba(42,23,18,.1);overflow:hidden}
        .stage .sc{width:58px;height:58px}
        .trk .is-now .stage{width:88px;height:88px;background:var(--yolk);box-shadow:0 0 0 6px rgba(255,198,70,.32)}
        .trk .is-now .stage .sc{width:68px;height:68px}
        .trk li:not(.is-done):not(.is-now) .stage{background:var(--white);box-shadow:inset 0 0 0 2px var(--line)}
        .trk li:not(.is-done):not(.is-now) .sc{filter:grayscale(1);opacity:.35}
        .tick{position:absolute;right:4px;bottom:4px;display:none;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--crimson);color:#fff;box-shadow:0 0 0 3px var(--white)}
        .trk .is-done .tick{display:grid}
        .trk b{font-size:14px;font-weight:600;line-height:1.2}
        .trk small{font-size:12.5px;line-height:1.3;color:var(--ink-soft)}
        .trk li:not(.is-done):not(.is-now) b{color:var(--ink-soft);font-weight:500}

        /* ---- картинки: без движения — итог этапа; движение ниже, только у сегодняшнего этапа ---- */
        .sc{display:block;overflow:visible}
        .sc .ln{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
        .sc .pen{transform:translate(45px,48px)}
        .sc .bx{transform-box:fill-box;transform-origin:50% 100%}
        .sc .whl,.sc-done .ok{transform-box:fill-box;transform-origin:50% 50%}
        .sc-done .van{opacity:0;transform:translateX(62px)}
        .sc-done .okc{stroke-dasharray:1;stroke-dashoffset:0}
        .sc-sent .bt,.sc-sent .sp,.sc-sent .ok{transform-box:fill-box;transform-origin:50% 50%}
        .sc-sent .lst,.sc-sent .bt,.sc-sent .sp{opacity:0}
        .sc-sent .ln{stroke-dasharray:1 2}
        .sc-sent .okc{stroke-dasharray:1;stroke-dashoffset:0}
        .sc-work .hd{transform-box:view-box;transform-origin:0 0}
        .sc-ready .dl,.sc-ready .dr{transform-box:fill-box;transform:scaleX(-.34)}
        .sc-ready .dl{transform-origin:0 50%}
        .sc-ready .dr{transform-origin:100% 50%}
        .sc-ready .hl{opacity:0}

        /* ---- полоса характеристик, как в каталоге: позиций, коробок, вес, объём ---- */
        .ord .spec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0;padding-top:14px;border-top:1px solid var(--line)}
        .ord .spec>div{min-width:0;padding-left:14px;border-left:1px solid var(--line-strong)}
        .ord .spec>div:first-child{padding-left:0;border-left:0}
        .ord .spec dt{font-size:12px;line-height:1.25;font-weight:600;color:var(--crimson-deep)}
        .ord .spec dd{margin:3px 0 0;font-size:16px;line-height:1.25;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

        /* ---- итог как в чеке: название, точки, сумма ---- */
        .rcpt{display:grid;gap:4px;padding-top:12px;border-top:1px solid var(--line)}
        .rcpt-row{display:flex;align-items:baseline;gap:10px;font-size:15.5px;line-height:1.5}
        .rcpt-row i{flex:1 1 auto;min-width:12px;border-bottom:2px dotted rgba(42,23,18,.26);translate:0 -5px}
        .rcpt-row b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
        .rcpt-ret{color:var(--crimson-deep)}
        .rcpt-total{margin-top:4px}
        .rcpt-total span{font-weight:600}
        .rcpt-total b{font:800 clamp(26px,2.6vw,31px)/1 var(--font-display);font-variant-numeric:lining-nums tabular-nums}
        .ord[data-state="off"] .rcpt-total b{color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:2px}

        /* ---- нижняя строка: что раскрыть и «повторить» ---- */
        .ord-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px}
        .tog{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0;border:0;background:none;color:var(--crimson-deep);font:600 15.5px/1.2 var(--font-body);cursor:pointer}
        .tog:hover{text-decoration:underline;text-underline-offset:3px}
        .tog span{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--cream);color:var(--ink);font-size:12.5px;font-variant-numeric:tabular-nums;text-decoration:none}
        .tog svg{flex:none;transition:rotate .2s}
        .tog[aria-expanded="true"] svg{rotate:180deg}
        .ord-foot .btn{margin-left:auto}

        /* ---- состав заказа по строкам ---- */
        .tbl{width:100%;border-collapse:collapse;font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums}
        .tbl th{padding:0 0 8px;font-size:12px;font-weight:600;color:var(--crimson-deep);text-align:left}
        .tbl td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
        .tbl th+th,.tbl td+td{padding-left:16px;text-align:right;white-space:nowrap}
        .tbl td small{display:block;font-size:12.5px;color:var(--ink-soft)}
        .tbl td:last-child{font-weight:600}
        .tbl tfoot td{border-top:1.5px solid var(--line-strong);font-weight:600}
        .tbl tfoot td:last-child{font:800 20px/1.2 var(--font-display);font-variant-numeric:lining-nums tabular-nums}

        /* ---- возврат: листок, оторванный от книжки чеков и приклеенный к заказу, с печатью ---- */
        .slip{position:relative;margin:12px 4px 4px;padding:24px clamp(16px,2.4vw,24px) 18px;border-radius:0 0 14px 14px;background:var(--slip);box-shadow:0 16px 26px -20px rgba(80,40,0,.6);rotate:-.5deg}
        .slip::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px;background:conic-gradient(from 135deg at top,var(--slip) 90deg,transparent 0) 0 0/14px 8px repeat-x;filter:drop-shadow(0 -1px 0 rgba(150,110,40,.25))}
        .slip-tape{position:absolute;left:-12px;top:-16px;width:92px;height:26px;background:rgba(255,224,140,.88);box-shadow:0 1px 2px rgba(80,40,0,.2);rotate:-9deg}
        .stamp{position:absolute;right:16px;top:14px;padding:6px 12px 5px;border:2.5px solid rgba(185,32,60,.72);border-radius:8px;color:rgba(185,32,60,.78);font:800 13px/1 var(--font-body);letter-spacing:.18em;text-transform:uppercase;rotate:-9deg;box-shadow:inset 0 0 0 2px var(--slip),inset 0 0 0 3.5px rgba(185,32,60,.45)}
        .slip-head{display:grid;gap:2px;margin-bottom:12px;padding-right:118px}
        .slip-head h3{font-weight:700;font-size:22px;line-height:1.15;color:var(--crimson-deep)}
        .slip-head p{font-size:14px;color:var(--ink-soft)}
        .tbl--ret td{border-top:1px dashed rgba(42,23,18,.2)}
        .tbl--ret td:last-child,.tbl--ret tfoot td:last-child{color:var(--crimson-deep)}
        .tbl--ret tfoot td{border-top:1.5px solid rgba(150,23,46,.4)}

        @media (max-width:560px){
          .ord{gap:14px}
          .ord-head{display:grid}
          .st{justify-self:start}
          .ord .spec{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 0}
          .ord .spec>div:nth-child(odd){padding-left:0;border-left:0}
          .rcpt-row{font-size:15px}
          .ord-foot .btn{width:100%;margin-left:0}
          .tbl{font-size:14.5px}
          .tbl th+th,.tbl td+td{padding-left:10px}
          .slip-head{padding-right:0;padding-top:28px}
          .slip{margin-inline:0;padding-inline:14px}
          .stamp{top:12px;right:12px}
          /* на телефоне этапы — столбиком: линия идёт вниз, названия справа */
          .trk{grid-template-columns:minmax(0,1fr);row-gap:8px}
          .trk::before,.trk::after{left:32px;top:32px;width:3px;translate:-50% 0}
          .trk::before{right:auto;bottom:32px;height:auto;background:repeating-linear-gradient(180deg,var(--line-strong) 0 7px,transparent 7px 13px)}
          .trk::after{height:calc((100% - 64px) * var(--k) / (var(--n) - 1))}
          .trk li{grid-template-columns:64px minmax(0,1fr);column-gap:14px;justify-items:start;align-items:center;padding:0;text-align:left}
          .stage-w{grid-row:1/3;width:64px;height:64px;margin:0}
          .stage{width:58px;height:58px}
          .stage .sc{width:44px;height:44px}
          .trk .is-now .stage{width:64px;height:64px}
          .trk .is-now .stage .sc{width:50px;height:50px}
          .tick{right:-2px;bottom:-2px;width:22px;height:22px}
          .trk b{align-self:end;font-size:14px}
          .trk small{grid-column:2;align-self:start;font-size:12.5px}
        }
        @media (prefers-reduced-motion:no-preference){
          /* «Новая»: на телефоне список заказа и под ним «Оформить»; кнопку нажимают, список и кнопка убираются, в середине
             экрана крутится загрузка и сразу превращается в большую красную галочку — заказ отправлен; потом всё сначала */
          .is-now .sc-sent .lst{animation:nv-lst 4.8s infinite}
          .is-now .sc-sent .rw1{animation:nv-rw1 4.8s infinite}
          .is-now .sc-sent .rw2{animation:nv-rw2 4.8s infinite}
          .is-now .sc-sent .rw3{animation:nv-rw3 4.8s infinite}
          .is-now .sc-sent .bt{animation:nv-bt 4.8s infinite}
          .is-now .sc-sent .sp{animation:nv-sp 4.8s infinite}
          .is-now .sc-sent .ok{animation:nv-ok 4.8s infinite}
          .is-now .sc-sent .okc{animation:nv-okc 4.8s infinite}
          @keyframes nv-lst{0%,23%{transform:none;opacity:1}30%,94%{transform:translateY(-5px);opacity:0}100%{transform:none;opacity:1}}
          @keyframes nv-rw1{0%{stroke-dashoffset:1.05;opacity:1}8%,28%{stroke-dashoffset:0;opacity:1}30%,100%{stroke-dashoffset:0;opacity:0}}
          @keyframes nv-rw2{0%,4%{stroke-dashoffset:1.05;opacity:1}12%,28%{stroke-dashoffset:0;opacity:1}30%,100%{stroke-dashoffset:0;opacity:0}}
          @keyframes nv-rw3{0%,8%{stroke-dashoffset:1.05;opacity:1}16%,28%{stroke-dashoffset:0;opacity:1}30%,100%{stroke-dashoffset:0;opacity:0}}
          @keyframes nv-bt{0%,18%{transform:none;opacity:1}21%{transform:scale(.9)}24%{transform:none;opacity:1}30%,94%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
          @keyframes nv-sp{0%,30%{transform:scale(.5) rotate(0deg);opacity:0}34%{transform:scale(1) rotate(90deg);opacity:1}58%{transform:scale(1) rotate(720deg);opacity:1}62%,100%{transform:scale(.4) rotate(800deg);opacity:0}}
          @keyframes nv-ok{0%,59%{transform:scale(0);opacity:1}66%{transform:scale(1.12)}71%,90%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
          @keyframes nv-okc{0%,63%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
          /* «Принят»: ручка пишет заказ на планшете, строка за строкой */
          .is-now .sc-new .ln1{animation:ln1 3.6s infinite}
          .is-now .sc-new .ln2{animation:ln2 3.6s infinite}
          .is-now .sc-new .ln3{animation:ln3 3.6s infinite}
          .is-now .sc-new .pen{animation:pen 3.6s infinite}
          @keyframes ln1{0%,5%{stroke-dashoffset:1;opacity:1}28%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
          @keyframes ln2{0%,33%{stroke-dashoffset:1;opacity:1}52%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
          @keyframes ln3{0%,57%{stroke-dashoffset:1;opacity:1}76%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
          @keyframes pen{
            0%,5%{transform:translate(23px,24px)} 11%{transform:translate(27px,23.2px)} 17%{transform:translate(32px,24.7px)} 23%{transform:translate(37px,23.3px)} 28%{transform:translate(41px,24px)}
            33%{transform:translate(23px,31px)} 39%{transform:translate(27px,30.2px)} 45%{transform:translate(32px,31.7px)} 52%{transform:translate(37px,31px)}
            57%{transform:translate(23px,38px)} 63%{transform:translate(28px,37.2px)} 69%{transform:translate(33px,38.7px)} 76%{transform:translate(39px,38px)}
            86%,100%{transform:translate(45px,48px)}
          }
          /* «Собирается»: четыре коробки по одной ложатся на поддон, подъезжает рохля, двумя качками ручки поднимает поддон
             и увозит; на место встаёт пустой поддон для следующего заказа */
          .is-now .sc-work .pb1{animation:pb1 6.4s infinite}
          .is-now .sc-work .pb2{animation:pb2 6.4s infinite}
          .is-now .sc-work .pb3{animation:pb3 6.4s infinite}
          .is-now .sc-work .pb4{animation:pb4 6.4s infinite}
          .is-now .sc-work .ld{animation:ld 6.4s infinite}
          .is-now .sc-work .jk{animation:jk 6.4s infinite}
          .is-now .sc-work .hd{animation:hd 6.4s infinite}
          .is-now .sc-work .whl{animation:jw 6.4s infinite}
          @keyframes pb1{0%,4%{transform:translateY(-46px);opacity:0;animation-timing-function:cubic-bezier(.55,0,1,.45)}5%{opacity:1}11%{transform:translateY(0)}13%{transform:scale(1.08,.86)}16%,86%{transform:none;opacity:1}87%,100%{transform:translateY(-46px);opacity:0}}
          @keyframes pb2{0%,12%{transform:translateY(-46px);opacity:0;animation-timing-function:cubic-bezier(.55,0,1,.45)}13%{opacity:1}19%{transform:translateY(0)}21%{transform:scale(1.08,.86)}24%,86%{transform:none;opacity:1}87%,100%{transform:translateY(-46px);opacity:0}}
          @keyframes pb3{0%,20%{transform:translateY(-46px);opacity:0;animation-timing-function:cubic-bezier(.55,0,1,.45)}21%{opacity:1}27%{transform:translateY(0)}29%{transform:scale(1.08,.86)}32%,86%{transform:none;opacity:1}87%,100%{transform:translateY(-46px);opacity:0}}
          @keyframes pb4{0%,28%{transform:translateY(-46px);opacity:0;animation-timing-function:cubic-bezier(.55,0,1,.45)}29%{opacity:1}35%{transform:translateY(0)}37%{transform:scale(1.08,.86)}40%,86%{transform:none;opacity:1}87%,100%{transform:translateY(-46px);opacity:0}}
          @keyframes ld{0%,52%{transform:none;opacity:1}55%,58%{transform:translateY(-1.1px)}61%,64%{transform:translateY(-2.2px);animation-timing-function:cubic-bezier(.32,0,.67,0)}84%{transform:translate(76px,-2.2px);opacity:1}84.1%{transform:none;opacity:0}88%{opacity:0}94%,100%{transform:none;opacity:1}}
          @keyframes jk{0%,40%{transform:translateX(72px);animation-timing-function:cubic-bezier(.33,1,.68,1)}52%{transform:none}64%{transform:none;animation-timing-function:cubic-bezier(.32,0,.67,0)}84%{transform:translateX(76px)}84.1%,100%{transform:translateX(72px)}}
          @keyframes hd{0%,52%{transform:none}55%{transform:rotate(20deg)}58%{transform:none}61%{transform:rotate(20deg)}64%,100%{transform:none}}
          @keyframes jw{0%,40%{transform:none;animation-timing-function:cubic-bezier(.33,1,.68,1)}52%,64%{transform:rotate(-720deg);animation-timing-function:cubic-bezier(.32,0,.67,0)}84%,100%{transform:rotate(0deg)}}
          /* «Готов к выдаче»: фургон сзади — двери открываются, четыре коробки по одной заходят внутрь, фургон приседает
             под каждой, двери закрываются, фонари мигают два раза */
          .is-now .sc-ready .dl,.is-now .sc-ready .dr{animation:gv-door 6.4s infinite}
          .is-now .sc-ready .gb1{animation:gv-b1 6.4s infinite}
          .is-now .sc-ready .gb2{animation:gv-b2 6.4s infinite}
          .is-now .sc-ready .gb3{animation:gv-b3 6.4s infinite}
          .is-now .sc-ready .gb4{animation:gv-b4 6.4s infinite}
          .is-now .sc-ready .vb{animation:gv-vb 6.4s infinite}
          .is-now .sc-ready .hl{animation:gv-hl 6.4s infinite}
          @keyframes gv-door{0%{transform:none}10%,56%{transform:scaleX(-.34)}66%,100%{transform:none}}
          @keyframes gv-b1{0%,12%{transform:translateY(16px) scale(1.3);opacity:0}14%{opacity:1}19%{transform:none}21%{transform:scale(1.06,.9)}23%,88%{transform:none;opacity:1}90%,100%{transform:translateY(16px) scale(1.3);opacity:0}}
          @keyframes gv-b2{0%,22%{transform:translateY(16px) scale(1.3);opacity:0}24%{opacity:1}29%{transform:none}31%{transform:scale(1.06,.9)}33%,88%{transform:none;opacity:1}90%,100%{transform:translateY(16px) scale(1.3);opacity:0}}
          @keyframes gv-b3{0%,32%{transform:translateY(16px) scale(1.3);opacity:0}34%{opacity:1}39%{transform:none}41%{transform:scale(1.06,.9)}43%,88%{transform:none;opacity:1}90%,100%{transform:translateY(16px) scale(1.3);opacity:0}}
          @keyframes gv-b4{0%,42%{transform:translateY(16px) scale(1.3);opacity:0}44%{opacity:1}49%{transform:none}51%{transform:scale(1.06,.9)}53%,88%{transform:none;opacity:1}90%,100%{transform:translateY(16px) scale(1.3);opacity:0}}
          @keyframes gv-vb{0%,18%,22%,28%,32%,38%,42%,48%,52%,100%{transform:none}20%,30%,40%,50%{transform:translateY(.9px)}}
          @keyframes gv-hl{0%,70%{opacity:0}73%{opacity:1}76%{opacity:0}79%{opacity:1}82%,100%{opacity:0}}
          /* «Выдан»: фургон уезжает с заказом, остаётся красная галочка — один раз */
          .is-now .sc-done .van{animation:away 3.2s both}
          .is-now .sc-done .whl{animation:spin .4s linear 4}
          .is-now .sc-done .spd{animation:spd 3.2s both}
          .is-now .sc-done .ok{animation:pop 3.2s both}
          .is-now .sc-done .okc{animation:tick 3.2s both}
          @keyframes away{0%{transform:none;opacity:1}10%{transform:translateX(-2px)}48%{transform:translateX(62px);opacity:1}49%,100%{transform:translateX(62px);opacity:0}}
          @keyframes spin{to{rotate:360deg}}
          @keyframes spd{0%,8%{opacity:0}14%,40%{opacity:1}48%,100%{opacity:0}}
          @keyframes pop{0%,48%{transform:scale(0)}58%{transform:scale(1.14)}64%,100%{transform:scale(1)}}
          @keyframes tick{0%,58%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
        }
        /* дорожка вне экрана — анимация сброшена; снова на экране — класс снимается и картинка играет с начала (app.html) */
        .trk.is-off *{animation:none!important}
        .trk{cursor:pointer;-webkit-tap-highlight-color:transparent}
        @media (prefers-reduced-motion:reduce){
          .tog svg{transition:none}
        }

        /* order placed */
        .done{flex:1 0 auto;position:relative;overflow:hidden;overflow:clip;background:var(--yolk)}
        .done-in{display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);align-items:center;gap:clamp(28px,5vw,72px);padding-block:clamp(32px,6vw,72px) clamp(56px,8vw,104px)}
        .done-ic{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--crimson);color:#fff}
        .done .spec{padding-block:16px;border-block:1px solid var(--line-strong)}
        .done-actions{display:grid;gap:12px}
        .done-art{position:relative;width:min(100%,400px);aspect-ratio:1/.9;margin-inline:auto}
        .done-art .wheat{left:8%;top:-8%;width:84%;color:var(--ink);opacity:.2;transform:rotate(8deg)}
        .art-cut.d1{right:0;bottom:0;width:76%}
        .art-cut.d2{left:0;top:10%;width:44%;rotate:-8deg}

        .foot{background:var(--crimson-deep);color:rgba(255,255,255,.9);font-size:14px}
        .foot-in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding-block:20px 24px}
        .mbar{display:none}

        @media (max-width:1100px){
          .user b{display:none}
        }
        @media (max-width:1000px){
          /* two rows: logo and sign-out, then the sections; once signed in only the sections stay pinned while scrolling */
          .top-in{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand side" "tabs tabs";gap:0 12px;min-height:0;padding-block:8px}
          .top:not(.signed-out){top:calc(env(safe-area-inset-top,0px) - 60px)}
          .brand{grid-area:brand}
          .brand img{height:52px}
          .top-side{grid-area:side}
          .top-side .back{display:none}
          .tabs{grid-area:tabs;gap:6px;margin-top:8px}
          .tabs button,.tabs .tab-link{flex:1 1 auto;min-height:44px;padding:0 8px;background:rgba(255,255,255,.5);font-size:14.5px}
          .t-long{display:none}
          .t-short{display:inline}
          .flow{grid-template-columns:minmax(0,1fr)}
          .side{position:static}
          .side-cta{display:none}
          #pick{scroll-margin-top:76px}
          .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--white);border-top:1px solid var(--line);box-shadow:0 -10px 24px -18px rgba(42,23,18,.45)}
          .mbar-t{flex:1 1 auto;min-width:0;font-size:13px;line-height:1.25;color:var(--ink-soft)}
          .mbar-t b{display:block;font:800 21px/1.1 var(--font-display);font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
          .mbar .btn{flex:none;min-height:52px;padding:0 20px}
          .has-bar .foot-in{padding-bottom:calc(98px + env(safe-area-inset-bottom,0px))}
        }
        @media (max-width:900px){
          .signin-in,.done-in{grid-template-columns:minmax(0,1fr)}
          .art{width:min(86%,360px)}
          .done-art{display:none}
        }
        @media (max-width:560px){
          body{font-size:16px}
          .brand span{font-size:18px}
          .help span{display:none}
          .help{font-size:14px}
          .item{gap:12px;padding:14px 8px}
          .item::before{left:8px;right:8px}
          .item-pic{width:96px}
          .item h3{font-size:15.5px}
          .price b{font-size:15px}
          .item::after{width:190px;right:-20px;bottom:-44px}
          /* группы — одной строкой с прокруткой вбок, а не 3–4 ряда кнопок */
          .tools .chips{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(-1*var(--gutter));padding:2px var(--gutter) 6px;scrollbar-width:none}
          .tools .chips::-webkit-scrollbar{display:none}
          .day{flex:1 1 104px}
          .actions .btn{width:100%}
        }
        @media (max-width:440px){.signed-out .brand span{display:none}}
        @media (max-width:370px){.brand span{display:none}}
        @media (prefers-reduced-motion:no-preference){
          .art-cut{animation:bob 6s ease-in-out infinite alternate}
          .art-cut.c2,.art-cut.d2{animation-delay:-2s}
          .art-cut.c3{animation-delay:-4s}
          @keyframes bob{to{translate:0 -9px}}
        }
        @media (prefers-reduced-motion:reduce){.btn{transition:none}}

        /* Узкая колонка (телефон): строка 1 — название и цена справа, строка 2 — «+ коробка» и −/+.
           .item-buy растворяется (display:contents), его кнопки становятся ячейками сетки. */
        @container list (max-width:560px){
          .item-body{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px 12px}
          .item-info{grid-column:1;grid-row:1;align-self:start}
          .item-buy{display:contents}
          .price{grid-column:2;grid-row:1;align-self:start;min-width:0;margin:0;text-align:right}
          .boxbtn{grid-column:1;grid-row:2;justify-self:start;padding:0 12px}
          .boxbtn .bx-n{display:none}
          .qty{grid-column:2;grid-row:2;justify-self:end}
          .item--cart .item-info{padding-right:0}
          .item--cart .qty{grid-column:1;justify-self:start}
          .item--cart .rm{top:auto;bottom:14px;right:4px;translate:none}
        }

        /* CRM: сообщения, недели истории, возвраты */
        .alert{margin:0 0 18px;padding:12px 16px;border-radius:14px;background:var(--off-bg);color:var(--crimson-deep);font-weight:600;font-size:15px;line-height:1.4}
        .alert--ok{background:var(--ok-bg);color:var(--ok-fg)}
        .weeknav{display:flex;align-items:center;gap:10px;margin:0 0 14px}
        .weeknav a,.weeknav span.off{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-strong);text-decoration:none;font-size:20px;line-height:1}
        .weeknav span.off{opacity:.35}
        .weeknav div{display:grid;font-weight:600}
        .weeknav small{font-weight:400;font-size:13px;color:var(--ink-soft)}
        .panel form{display:grid;gap:18px}
        .access-phone{font-weight:700;white-space:nowrap}
    </style>
</head>
<body>

<!--/* signedIn — показывать разделы и «Выйти»; active — products/cart/orders; cartCount — бейдж корзины. */-->
<header th:fragment="top(signedIn, active, cartCount, clientName)" class="top" th:classappend="${signedIn} ? '' : 'signed-out'" id="top">
    <div class="wrap top-in">
        <a class="brand" href="/" aria-label="На главную">
            <img src="/promo/img/logo.svg" alt="Юг Сладости. Кондитерская" width="384" height="223">
            <span>Онлайн-заказ</span>
        </a>
        <nav class="tabs" aria-label="Разделы магазина" th:if="${signedIn}">
            <a class="tab-link" href="/shop/products" th:attr="aria-current=${active == 'products'} ? 'page' : null">Товары</a>
            <a class="tab-link" href="/shop/catalog" id="tab-cart" th:attr="aria-current=${active == 'cart'} ? 'page' : null">Корзина <span class="badge" id="badge" th:hidden="${cartCount == 0}" th:text="${cartCount}">0</span></a>
            <a class="tab-link" href="/shop/orders" th:attr="aria-current=${active == 'orders'} ? 'page' : null"><span class="t-long">История заказов</span><span class="t-short">История</span></a>
        </nav>
        <div class="top-side" data-nosnippet>
            <a class="back" href="/" th:unless="${signedIn}">← На сайт</a>
            <span class="help" th:if="${!signedIn and company.phone != null}"><span>Помощь: </span><b th:text="${firstPhone}">телефон</b></span>
            <span class="user" th:if="${signedIn}"><b th:text="${clientName}">Клиент</b>
                <form action="/shop/reset" method="post" style="display:inline"><button class="link" type="submit">Выйти</button></form>
            </span>
        </div>
    </div>
</header>

<footer th:fragment="foot" class="foot">
    <div class="wrap foot-in">
        <span>© <th:block th:text="${#temporals.year(#temporals.createNow())} + ' ' + (${company.name} ?: 'Юг Сладости')">2026 Юг Сладости</th:block><th:block th:if="${company.address}" th:text="' · ' + ${company.address}"></th:block></span>
        <span th:if="${company.phone}" th:text="'Телефон: ' + ${company.phone}">телефон</span>
    </div>
</footer>

</body>
</html>
