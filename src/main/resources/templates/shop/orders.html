<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>История заказов — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/turbo.min.js}"></script>
    <script th:src="@{/js/btn-animate.js}"></script>
</head>
<body>
<div class="shop-page">
    <header class="shop-topbar">
        <div class="brand"><img th:src="@{/images/logo.png}" alt="Логотип"> Юг Сладости</div>
    </header>

    <main class="shop-content shop-content-with-tabbar">
        <div class="shop-title">История заказов</div>

        <div class="shop-week-nav">
            <a class="shop-week-arrow" th:href="@{/shop/orders(week=${week + 1})}" aria-label="Предыдущая неделя">‹</a>
            <div class="shop-week-label">
                <div th:text="${weekLabel}"></div>
                <small th:if="${week < 2}" th:text="${weekRange}"></small>
            </div>
            <a class="shop-week-arrow" th:if="${week > 0}" th:href="@{/shop/orders(week=${week - 1})}" aria-label="Следующая неделя">›</a>
            <a class="shop-week-arrow" th:if="${week == 0}" th:href="@{/shop/orders}" aria-label="Последние 7 дней">›</a>
            <span class="shop-week-arrow disabled" th:if="${week < 0}">›</span>
        </div>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <div th:each="row : ${rows}" class="shop-order-card items-closed">
            <div class="shop-order-top">
                <div>
                    <div class="shop-order-date"
                         th:text="${#temporals.format(row.order.createdAt, 'dd.MM.yyyy')} + ' · №' + ${row.order.id}"></div>
                    <span class="badge" th:classappend="${row.order.status}" th:text="${row.order.status.label}"></span>
                </div>
                <div class="shop-order-total-box">
                    <div class="shop-order-total" th:text="${row.totalLabel}"></div>
                    <div class="shop-order-return-total" th:if="${row.returnTotalLabel}"
                         th:text="'возврат ' + ${row.returnTotalLabel}"></div>
                    <div class="shop-order-net-total" th:if="${row.netTotalLabel}"
                         th:text="'итого ' + ${row.netTotalLabel}"></div>
                </div>
            </div>

            <button class="shop-items-toggle" type="button">
                <span th:text="'Состав заказа (' + ${#lists.size(row.items)} + ')'"></span>
                <span class="chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="shop-items-collapse">
                <div class="shop-items-collapse-inner">
                    <ul class="shop-order-items">
                        <li th:each="it : ${row.items}">
                            <span class="name" th:text="${it.name}"></span>
                            <span class="qty" th:text="${it.qtyLabel}"></span>
                            <span class="sum" th:text="${it.sumLabel}"></span>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="shop-order-actions">
                <form th:action="@{/shop/orders/{id}/repeat(id=${row.order.id})}" method="post" data-turbo="false">
                    <button class="btn small" type="submit">Повторить заказ</button>
                </form>
                <button class="btn small shop-returns-toggle" type="button" th:if="${!#lists.isEmpty(row.returns)}"
                        th:attr="data-count=${#lists.size(row.returns)}"
                        th:text="'Показать возврат (' + ${#lists.size(row.returns)} + ')'"></button>
            </div>

            <div class="shop-returns" th:if="${!#lists.isEmpty(row.returns)}">
                <div class="shop-returns-inner">
                    <div class="shop-return" th:each="ret : ${row.returns}">
                        <div class="shop-return-head">
                            <span th:text="'Возврат от ' + ${ret.dateLabel} + (${ret.documentNumber} != null ? ' · №' + ${ret.documentNumber} : '')"></span>
                            <b th:text="'−' + ${ret.totalLabel}"></b>
                        </div>
                        <div class="shop-return-reason" th:if="${ret.reason}" th:text="${ret.reason}"></div>
                        <ul class="shop-order-items">
                            <li th:each="it : ${ret.items}">
                                <span class="name" th:text="${it.name}"></span>
                                <span class="qty" th:text="${it.qtyLabel}"></span>
                                <span class="sum" th:text="${it.sumLabel}"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="empty" th:if="${#lists.isEmpty(rows)}">За эту неделю заказов нет</div>

        <script>
            // Один делегированный обработчик: страница открывается через Turbo, скрипт может
            // выполниться повторно — флаг не даёт навесить обработчик дважды.
            if (!window.shopReturnsToggleBound) {
                window.shopReturnsToggleBound = true;
                document.addEventListener('click', function (e) {
                    if (!e.target.closest) return;
                    var btn = e.target.closest('.shop-returns-toggle');
                    if (!btn) {
                        // Нажатие в любом месте карточки открывает/скрывает состав заказа (по
                        // умолчанию скрыт) — кроме кнопок, форм и раскрытого списка возвратов.
                        var card = e.target.closest('.shop-order-card');
                        if (card && !e.target.closest('button:not(.shop-items-toggle), form, a, .shop-returns')) {
                            card.classList.toggle('items-closed');
                        }
                        return;
                    }
                    var card = btn.closest('.shop-order-card');
                    var open = card.classList.toggle('returns-open');
                    btn.textContent = open ? 'Скрыть возврат' : 'Показать возврат (' + btn.dataset.count + ')';
                });
            }
        </script>
    </main>

    <div th:replace="~{shop/fragments/bottom-nav :: bottomnav(active='orders', cartCount=${cartCount})}"></div>
</div>
</body>
</html>
