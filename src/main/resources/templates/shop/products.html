<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/turbo.min.js}"></script>
    <script th:src="@{/js/btn-animate.js}"></script>
</head>
<body>
<div class="shop-page">
    <header class="shop-topbar">
        <div class="brand"><img th:src="@{/images/logo.png}" alt="Логотип"> Юг Сладости</div>
        <div class="shop-topbar-right">
            <form th:action="@{/shop/reset}" method="post" data-turbo="false">
                <button class="btn small" type="submit">Сменить номер</button>
            </form>
        </div>
    </header>

    <main class="shop-content shop-content-with-tabbar">
        <input type="text" id="shopProductSearch" class="product-search"
               placeholder="Поиск товара по названию…" oninput="crmFilterShopProducts()">

        <div th:each="entry : ${rowsByCategory}" class="category-section" th:attr="data-section=true">
            <h2 th:if="${entry.key != null and !#strings.isEmpty(entry.key)}" th:text="${entry.key}"></h2>
            <div class="product-grid">
                <a th:each="row : ${entry.value}" class="product-card shop-product-card"
                   th:href="@{/shop/products/{id}(id=${row.product().id})}"
                   th:attr="data-name=${#strings.toLowerCase(row.product().name)}">
                    <div class="shop-product-media">
                        <img th:if="${row.product().imageUrl != null}" th:src="${row.product().imageUrl}" alt="" class="product-card-img">
                        <div th:unless="${row.product().imageUrl != null}" class="product-card-avatar"
                             th:text="${#strings.substring(row.product().name, 0, 1)}"></div>
                    </div>
                    <div class="product-card-body">
                        <div class="product-card-name" th:text="${row.product().name}"></div>
                        <div class="product-card-price" th:text="${row.priceLabel()}"></div>
                    </div>
                    <button type="button" class="shop-quick-add" title="Добавить в корзину"
                            th:attr="data-product-id=${row.product().id},data-name=${row.product().name},
                                     data-price=${row.priceRaw()},data-price-label=${row.priceLabel()},
                                     data-step=${row.stepRaw()},data-unit=${row.unit()},data-in-cart=${row.inCartRaw()},
                                     data-img=${row.product().imageUrl}">+</button>
                </a>
            </div>
        </div>

        <p class="empty" th:if="${#maps.isEmpty(rowsByCategory)}">Товаров пока нет</p>
        <p class="empty" id="shopProductEmpty" style="display:none">Ничего не найдено</p>
    </main>

    <div th:replace="~{shop/fragments/bottom-nav :: bottomnav(active='home', cartCount=${cartCount})}"></div>

    <!-- Окно ввода количества по «+» на карточке: клиент сразу вводит, сколько нужно. -->
    <div class="qty-modal" id="qtyModal" role="dialog" aria-modal="true" aria-labelledby="qtyModalName">
        <div class="qty-modal-sheet">
            <div class="qty-modal-head">
                <img id="qtyModalImg" alt="" style="display:none">
                <div class="product-card-avatar" id="qtyModalAvatar"></div>
                <div>
                    <div class="qty-modal-name" id="qtyModalName"></div>
                    <div class="qty-modal-price" id="qtyModalPrice"></div>
                </div>
            </div>
            <div class="qty-modal-stepper">
                <button type="button" id="qtyModalDec" aria-label="Меньше">−</button>
                <input type="number" id="qtyModalInput" inputmode="decimal" min="0" aria-label="Количество">
                <button type="button" id="qtyModalInc" aria-label="Больше">+</button>
            </div>
            <div class="qty-modal-unit" id="qtyModalUnit"></div>
            <div class="qty-modal-sum" id="qtyModalSum"></div>
            <div class="qty-modal-actions">
                <button type="button" class="btn" id="qtyModalCancel">Отмена</button>
                <button type="button" class="btn primary" id="qtyModalOk">Добавить</button>
            </div>
        </div>
    </div>
</div>
<script th:inline="none">
    // Запоминаем прокрутку строго по turbo:before-visit (Turbo сам вызывает это событие
    // прямо перед стартом любого перехода — по клику на карточку, крестику или таб-бару).
    // Пробовали проще — слушать обычный "scroll" и сохранять последнее значение — но Turbo
    // в момент старта перехода сам на мгновение обнуляет прокрутку СТАРОЙ страницы, и этот
    // "scroll"-листер успевает перезаписать сохранённое значение нулём прямо перед уходом.
    // Пробовали слушать "click" на самой карточке — тоже ненадёжно: Turbo перехватывает
    // клик по ссылке своим обработчиком на document раньше, чем событие дойдёт до элемента.
    // Этот блок — код верхнего уровня скрипта, выполняется один раз (при обычной загрузке
    // страницы), а не при каждом Turbo-переходе — так и нужно, т.к. document (и подписки на
    // нём) переживают Turbo-переходы, дублировать подписку не нужно.
    document.addEventListener('turbo:before-visit', function () {
        // Turbo не уничтожает подписки на document при переходах — этот обработчик,
        // навешанный на главной, продолжит получать turbo:before-visit и после того, как
        // Turbo подменит содержимое на страницу товара. Проверяем, что мы физически ещё на
        // главной (по полю поиска, которое есть только здесь) — иначе, например, уход со
        // страницы товара (форма "Добавить") затирал бы сохранённую прокрутку нулём.
        if (document.getElementById('shopProductSearch')) {
            sessionStorage.setItem('shopHomeScroll', String(window.scrollY));
        }
    });

    // А вот это наоборот должно повторяться при каждом переходе — "turbo:load" срабатывает
    // и при обычном первом заходе, и при каждом Turbo-переходе, а DOM (карточки, поле
    // поиска) каждый раз новый.
    document.addEventListener('turbo:load', function () {
        window.crmFilterShopProducts = function () {
            var q = document.getElementById('shopProductSearch').value.trim().toLowerCase();
            var totalVisible = 0;
            document.querySelectorAll('.category-section').forEach(function (section) {
                var visibleInSection = 0;
                section.querySelectorAll('.shop-product-card').forEach(function (card) {
                    var match = card.getAttribute('data-name').indexOf(q) !== -1;
                    card.style.display = match ? '' : 'none';
                    if (match) visibleInSection++;
                });
                section.style.display = visibleInSection > 0 ? '' : 'none';
                totalVisible += visibleInSection;
            });
            document.getElementById('shopProductEmpty').style.display = totalVisible === 0 ? '' : 'none';
        };

        // «+» на карточке открывает окно ввода количества (раньше сразу клал 1 шт. в корзину —
        // клиенту приходилось потом идти в корзину и править). Количество уходит тем же
        // эндпоинтом, что и прямой ввод в корзине (/set). Кнопка внутри <a> — обязательно
        // stopPropagation, иначе клик ещё и откроет карточку товара.
        var modal = document.getElementById('qtyModal');
        var input = document.getElementById('qtyModalInput');
        var current = null;
        var money = new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 2});

        function stepOf() { return parseFloat(current.getAttribute('data-step')) || 1; }
        function round(v) { return Math.round(v * 1000) / 1000; }
        function updateSum() {
            var q = parseFloat(String(input.value).replace(',', '.'));
            var price = parseFloat(current.getAttribute('data-price')) || 0;
            var ok = q > 0;
            document.getElementById('qtyModalSum').textContent = ok ? 'Сумма: ' + money.format(round(q * price)) + ' ₸' : 'Введите количество';
            document.getElementById('qtyModalOk').disabled = !ok;
        }
        function openModal(btn) {
            current = btn;
            var img = btn.getAttribute('data-img');
            var imgEl = document.getElementById('qtyModalImg');
            var avatar = document.getElementById('qtyModalAvatar');
            if (img) { imgEl.src = img; imgEl.style.display = ''; avatar.style.display = 'none'; }
            else { imgEl.style.display = 'none'; avatar.style.display = ''; avatar.textContent = btn.getAttribute('data-name').charAt(0); }
            document.getElementById('qtyModalName').textContent = btn.getAttribute('data-name');
            document.getElementById('qtyModalPrice').textContent = btn.getAttribute('data-price-label');
            document.getElementById('qtyModalUnit').textContent = btn.getAttribute('data-unit');
            var inCart = btn.getAttribute('data-in-cart');
            input.value = inCart ? inCart : '';
            input.step = String(stepOf());
            document.getElementById('qtyModalOk').textContent = inCart ? 'Сохранить' : 'Добавить';
            updateSum();
            modal.classList.add('open');
            setTimeout(function () { input.focus(); input.select(); }, 50);
        }
        function closeModal() { modal.classList.remove('open'); current = null; input.blur(); }

        document.querySelectorAll('.shop-quick-add').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                openModal(btn);
            });
        });
        input.addEventListener('input', updateSum);
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('qtyModalOk').click(); });
        document.getElementById('qtyModalInc').addEventListener('click', function () {
            var q = parseFloat(String(input.value).replace(',', '.')) || 0;
            input.value = round(q + stepOf()); updateSum();
        });
        document.getElementById('qtyModalDec').addEventListener('click', function () {
            var q = parseFloat(String(input.value).replace(',', '.')) || 0;
            input.value = Math.max(round(q - stepOf()), 0) || ''; updateSum();
        });
        document.getElementById('qtyModalCancel').addEventListener('click', closeModal);
        modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
        document.getElementById('qtyModalOk').addEventListener('click', function () {
            var q = parseFloat(String(input.value).replace(',', '.'));
            if (!(q > 0) || !current) return;
            var btn = current;
            var id = btn.getAttribute('data-product-id');
            var body = new URLSearchParams({qty: String(q)});
            closeModal();
            fetch('/shop/cart/item/' + id + '/set', {method: 'POST', headers: {'X-Requested-With': 'fetch'}, body: body})
                .then(function (res) {
                    if (!res.ok) throw new Error('bad status');
                    return res.json();
                })
                .then(function (data) {
                    btn.setAttribute('data-in-cart', String(q));
                    playAddAnimation(btn, data.cartCount);
                })
                .catch(function () {
                    // Сеть подвела — переходим на карточку товара как надёжный запасной путь.
                    window.location.href = '/shop/products/' + id;
                });
        });

        function playAddAnimation(btn, cartCount) {
            btn.classList.remove('added');
            void btn.offsetWidth; // перезапуск CSS-анимации при повторном клике подряд
            btn.classList.add('added');

            var badge = document.getElementById('shopTabCartBadge');
            if (badge) {
                badge.textContent = String(cartCount);
                badge.style.display = cartCount > 0 ? '' : 'none';
                badge.classList.remove('bump');
                void badge.offsetWidth;
                badge.classList.add('bump');
            }
        }

        // Восстанавливаем прокрутку, сохранённую в момент ухода со страницы (см.
        // turbo:before-visit выше) — иначе после добавления товара из середины длинного
        // списка приходится листать заново.
        var savedScroll = sessionStorage.getItem('shopHomeScroll');
        if (savedScroll !== null) {
            var target = parseInt(savedScroll, 10);
            // Turbo сам сбрасывает прокрутку в 0 после перехода (обычное поведение для
            // "нового" перехода по ссылке) — это происходит уже ПОСЛЕ "turbo:load", поэтому
            // наш scrollTo нужно откладывать на следующие кадры отрисовки, иначе Turbo его
            // тут же перезатрёт своим сбросом.
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    window.scrollTo(0, target);
                });
            });
        }
    });
</script>
</body>
</html>
