<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Заказ оформлен — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/turbo.min.js}"></script>
    <script th:src="@{/js/btn-animate.js}"></script>
</head>
<body class="login-page">
<div class="login-card">
    <div class="brand"><img th:src="@{/images/logo.png}" alt="Логотип"> Юг Сладости</div>
    <div class="alert success">
        Спасибо! Заказ № <span th:text="${order.id}"></span> принят на сумму
        <span th:text="${totalLabel}"></span> ₸. Мы свяжемся с вами для подтверждения.
    </div>
    <a class="btn primary" th:href="@{/shop/products}">Сделать ещё один заказ</a>
</div>
</body>
</html>
