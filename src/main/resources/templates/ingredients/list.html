<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Сырьё — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Сырьё</h1><p class="subtitle">Остатки сырья и пороги для автоматических уведомлений</p></div>
            <a class="btn primary" th:href="@{/ingredients/new}">+ Ингредиент</a>
        </div>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <input type="text" id="crm-ingredient-search" class="product-search"
               placeholder="Поиск сырья по названию…" oninput="crmFilterIngredients()"
               th:if="${not #lists.isEmpty(ingredients)}">

        <div class="panel">
            <table th:if="${not #lists.isEmpty(ingredients)}">
                <tr><th>Название</th><th>Остаток</th><th>Минимум</th><th></th><th></th></tr>
                <tr th:each="i : ${ingredients}" th:attr="data-name=${#strings.toLowerCase(i.name)}">
                    <td th:text="${i.name}"></td>
                    <td th:classappend="${i.lowStock} ? 'low-stock-row'" th:text="${i.quantityInStock} + ' ' + ${i.unit}"></td>
                    <td th:text="${i.minThreshold} + ' ' + ${i.unit}"></td>
                    <td><span class="badge CANCELLED" th:if="${i.lowStock}">Мало</span></td>
                    <td class="actions">
                        <a class="btn small" th:href="@{/ingredients/{id}/edit(id=${i.id})}">Изменить</a>
                        <form th:action="@{/ingredients/{id}/delete(id=${i.id})}" method="post" onsubmit="return confirm('Удалить ингредиент?');">
                            <button class="btn small danger" type="submit">Удалить</button>
                        </form>
                    </td>
                </tr>
            </table>
            <p class="empty" th:if="${#lists.isEmpty(ingredients)}">Ингредиентов пока нет</p>
            <p class="empty" id="crm-ingredient-empty" style="display:none">Ничего не найдено</p>
        </div>
    </main>
</div>
<script th:inline="none">
    function crmFilterIngredients() {
        var q = document.getElementById('crm-ingredient-search').value.trim().toLowerCase();
        var rows = document.querySelectorAll('table tr[data-name]');
        var visible = 0;
        rows.forEach(function (row) {
            var match = row.getAttribute('data-name').indexOf(q) !== -1;
            row.style.display = match ? '' : 'none';
            if (match) visible++;
        });
        document.getElementById('crm-ingredient-empty').style.display = visible === 0 ? '' : 'none';
    }
</script>
</body>
</html>
