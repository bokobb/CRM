<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ингредиент — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <h1 th:text="${ingredient.id} != null ? 'Редактировать ингредиент' : 'Новый ингредиент'">Ингредиент</h1>

        <form class="panel" th:action="@{/ingredients}" th:object="${ingredient}" method="post" style="max-width:480px">
            <input type="hidden" th:field="*{id}">
            <div class="field">
                <label>Название</label>
                <input type="text" th:field="*{name}" required>
            </div>
            <div class="field">
                <label>Единица измерения (кг, г, л, мл, шт)</label>
                <input type="text" th:field="*{unit}" required>
            </div>
            <div class="row">
                <div class="field">
                    <label>Текущий остаток</label>
                    <input type="number" step="0.001" th:field="*{quantityInStock}" required>
                </div>
                <div class="field">
                    <label>Минимальный порог</label>
                    <input type="number" step="0.001" th:field="*{minThreshold}" required>
                </div>
            </div>
            <div class="actions">
                <button class="btn primary" type="submit">Сохранить</button>
                <a class="btn" th:href="@{/ingredients}">Отмена</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
