<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
<a class="back" href="/admin/photos"><th:block th:utext="${i['back']}"></th:block>Фото товаров</a>
<div class="oh"><div class="oh-t"><h2 th:text="${p.name}">Товар</h2></div>
    <p class="oh-m">Первое фото — обложка на сайте, в магазине и в приложении. Фото 3:4, до 10 МБ каждое.</p>
    <div class="acts"><a class="btn btn-soft" th:href="${'/admin/products/' + p.id}">Карточка товара</a></div></div>
<section class="card form-card" style="margin-bottom:18px">
    <form th:action="${'/admin/photos/' + p.id + '/add'}" method="post" enctype="multipart/form-data" class="split">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label class="field" style="flex:1 1 280px"><span>Добавить фото</span><input class="inp" type="file" name="files" accept="image/*" multiple required></label>
        <button class="btn btn-primary" type="submit"><th:block th:utext="${i['upload']}"></th:block>Загрузить</button>
    </form>
</section>
<div class="ph-grid">
    <div th:each="ph, it : ${album}" class="ph">
        <img th:src="${ph.url}" alt="">
        <span th:if="${it.first}" class="tag tag--now">обложка</span>
        <div class="ph-acts">
            <form th:action="${'/admin/photos/' + p.id + '/' + ph.id + '/move'}" method="post" style="display:contents"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button th:unless="${it.first}" class="btn btn-soft" type="submit" name="dir" value="first">Обложка</button>
                <button th:unless="${it.first}" class="btn btn-soft" type="submit" name="dir" value="up" aria-label="Левее">←</button>
                <button th:unless="${it.last}" class="btn btn-soft" type="submit" name="dir" value="down" aria-label="Правее">→</button></form>
            <form th:action="${'/admin/photos/' + p.id + '/' + ph.id + '/delete'}" method="post" style="display:contents"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-danger" type="submit" aria-label="Удалить фото" data-confirm="Фото удалится из альбома товара." data-confirm-title="Удалить фото?" data-confirm-ok="Удалить">✕</button></form>
        </div>
    </div>
</div>
<p class="cnt" th:if="${album.isEmpty()}">В альбоме пока нет фото.</p>
</th:block>
</body>
</html>
