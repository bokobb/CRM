<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{::scripts})}">
<body>
<th:block th:fragment="content">
<a class="back" th:href="${id != null ? '/admin/returns/' + id : (orderId != null ? '/admin/orders/' + orderId : '/admin/returns')}"><th:block th:utext="${i['back']}"></th:block><th:block th:text="${id != null ? 'Возврат № ' + id : (orderId != null ? 'Заказ № ' + orderId : 'Все возвраты')}"></th:block></a>
<div class="oh"><div class="oh-t"><h2 th:text="${id != null ? 'Изменить возврат № ' + id : 'Оформить возврат'}">Оформить возврат</h2></div>
    <p class="oh-m">Какие товары и сколько вернули, причина. Строки без количества не попадут в возврат. Сумма возврата уменьшит сумму заказа.</p></div>
<div class="errs errs-top" role="alert" th:if="${!errors.isEmpty()}"><span th:each="e : ${errors}" th:text="${e}"></span></div>
<form method="post" th:action="${id != null ? '/admin/returns/' + id : '/admin/returns'}" data-guard="Возврат не сохранён." id="rf">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="section-gap">
    <section class="card form-card">
        <div class="fgrid">
            <label class="field"><span>Клиент</span><select class="sel full" name="client" id="rf-client" required>
                <option value="">— выберите —</option>
                <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == clientId}"></option></select></label>
            <label class="field"><span>Дата возврата</span><input class="inp" type="date" name="date" th:value="${date}"></label>
            <label class="field"><span>Заказ (необязательно)</span><select class="sel full" name="order">
                <option value="">— не закреплять —</option>
                <option th:each="o : ${orders}" th:value="${o.id}" th:text="${'№ ' + o.id + ' от ' + @fmt.dm(@fmt.day(o)) + ' · ' + @fmt.money(o.totalPrice)}" th:selected="${o.id == orderId}"></option>
                <option th:if="${orderId != null and !#lists.contains(orders.![id], orderId)}" th:value="${orderId}" selected th:text="${'№ ' + orderId}"></option></select></label>
        </div>
        <fieldset class="fs"><legend class="lbl">Причина</legend><div class="radios">
            <label class="radio" th:each="r : ${reasons}"><input type="radio" name="reason" th:value="${r}" th:checked="${r == reason}"><th:block th:text="${r}"></th:block></label></div></fieldset>
        <label class="field"><span>Подробнее</span><input class="inp" name="reasonText" maxlength="300" th:value="${reasonText}" placeholder="Например: плесень на 3 упаковках"></label>
    </section>
    <section class="card">
        <div class="card-h"><h2>Товары</h2><p>Итого: <b data-total="rt">0 ₸</b></p></div>
        <div class="tbl-w"><table class="tbl edit-rows" id="rt">
            <thead><tr><th>Товар</th><th class="r">Кол-во, шт</th><th class="r">Цена</th><th class="r">Сумма</th><th class="acts-col"></th></tr></thead>
            <tbody>
            <tr th:each="l : ${lines}">
                <td><select class="sel full" name="product"><option value="">— товар —</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}" th:selected="${p.id == l.productId}" th:attr="data-price=${prices[p.id] != null ? prices[p.id] : p.price}"></option></select></td>
                <td class="r"><input class="inp num-in" name="qty" inputmode="decimal" th:value="${l.qty}" data-q></td>
                <td class="r"><input class="inp num-in" name="price" inputmode="decimal" th:value="${l.price}" data-p></td>
                <td class="r num" data-s></td>
                <td><button class="rx-del" type="button" data-del-row aria-label="Удалить строку" th:utext="${i['trash']}"></button></td>
            </tr>
            </tbody>
        </table></div>
        <button class="add" type="button" data-add-row="rt"><th:block th:utext="${i['plus']}"></th:block><span>Добавить товар</span></button>
    </section>
    <div class="form-acts"><a class="btn btn-soft" th:href="${id != null ? '/admin/returns/' + id : '/admin/returns'}">Отмена</a><button class="btn btn-primary" type="submit" th:text="${id != null ? 'Сохранить' : 'Оформить возврат'}"></button></div>
    </div>
</form>
<template id="row-tpl"><tr>
    <td><select class="sel full" name="product"><option value="">— товар —</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}" th:attr="data-price=${prices[p.id] != null ? prices[p.id] : p.price}"></option></select></td>
    <td class="r"><input class="inp num-in" name="qty" inputmode="decimal" data-q></td>
    <td class="r"><input class="inp num-in" name="price" inputmode="decimal" data-p></td>
    <td class="r num" data-s></td>
    <td><button class="rx-del" type="button" data-del-row aria-label="Удалить строку" th:utext="${i['trash']}"></button></td>
</tr></template>
</th:block>
<th:block th:fragment="scripts">
<script src="/admin/assets/lines.js?v=1"></script>
<script th:if="${id == null}">
document.getElementById('rf-client').addEventListener('change', function () {
  Admin.guard.set(false);
  location.href = '/admin/returns/new?client=' + this.value;
});
</script>
</th:block>
</body>
</html>
