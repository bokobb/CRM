<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{::scripts})}">
<body>
<th:block th:fragment="content">
<a class="back" th:href="${p != null ? '/admin/purchases/' + p.id : '/admin/purchases'}"><th:block th:utext="${i['back']}"></th:block><th:block th:text="${p != null ? 'Покупка № ' + p.id : 'Все покупки'}"></th:block></a>
<div class="oh"><div class="oh-t"><h2 th:text="${p != null ? 'Изменить покупку № ' + p.id : 'Новая покупка'}">Новая покупка</h2></div>
    <p class="oh-m" th:text="${p != null ? 'Приход перепроведётся: остатки сдвинутся на разницу, документ в 1С перезапишется.' : 'Сырьё приходит на склад сразу; в 1С уходит «Поступление товаров» от поставщика.'}"></p></div>
<form id="px-form" method="post" th:action="${p != null ? '/admin/purchases/' + p.id : '/admin/purchases'}" novalidate
      th:attr="data-guard=${p != null ? 'Изменения покупки № ' + p.id + ' не сохранены.' : 'Покупка ещё не оформлена.'}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div id="px-hidden"></div>
    <div class="of">
        <div class="of-main">
            <section class="card of-sec" aria-labelledby="px-h1"><div class="card-h"><h2 id="px-h1"><span class="step">1</span> Поставщик и дата</h2></div><div class="card-b"><div class="fgrid">
                <label class="field"><span>Поставщик</span><select class="sel" id="px-sup"></select></label>
                <label class="field"><span>Дата покупки</span><input class="inp" type="date" id="px-date" name="date"></label></div><p class="hint" id="px-sh"></p></div></section>
            <section class="card of-sec" aria-labelledby="px-h2"><div class="card-h"><h2 id="px-h2"><span class="step">2</span> Сырьё</h2><p>сумма — как в накладной поставщика</p></div>
                <div class="card-b" style="padding-bottom:0"><div class="px-lines" id="px-lines"></div></div>
                <button class="add" type="button" id="px-add"><th:block th:utext="${i['plus']}"></th:block><span>Добавить сырьё</span></button></section>
        </div>
        <aside class="card of-sum" id="px-sum" aria-label="Итог покупки"></aside>
    </div>
</form>
</th:block>
<th:block th:fragment="scripts">
<script type="application/json" id="px-data" th:utext="${formJson}"></script>
<script src="/admin/assets/ops.js?v=1"></script>
<script src="/admin/assets/pur.js?v=1"></script>
</th:block>
</body>
</html>
