<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{::scripts})}">
<body>
<th:block th:fragment="content">
<a class="back" th:href="${r != null ? '/admin/requests/' + r.id : '/admin/requests'}"><th:block th:utext="${i['back']}"></th:block><th:block th:text="${r != null ? 'Заявка № ' + r.id : 'Все заявки'}">Все заявки</th:block></a>
<div class="oh">
    <div class="oh-t"><h2 th:text="${r != null ? 'Изменить заявку № ' + r.id : 'Новая заявка'}">Новая заявка</h2>
        <th:block th:if="${r != null}"><span class="st" th:classappend="${badge.cls}"><th:block th:utext="${i16[badge.icon]}"></th:block><span th:text="${badge.label}"></span></span><span class="tag tag--pf" th:text="${r.title}"></span></th:block></div>
    <p class="oh-m" th:text="${r != null ? 'Название не меняется — это группа изделий.' + (r.status.name() == 'COLLECTED' ? ' Сырьё уже выдано: разница по составу спишется со склада или вернётся на него, цеху её нужно будет довыдать или забрать.' : '') : 'Пишите замесы или штуки — второе посчитается само по выходу рецептуры. Изделия из разных групп станут отдельными заявками.'}"></p>
</div>
<form id="qx-form" method="post" th:action="${r != null ? '/admin/requests/' + r.id + '/edit' : '/admin/requests'}" novalidate
      th:attr="data-guard=${r != null ? 'Изменения заявки № ' + r.id + ' не сохранены.' : 'Новая заявка ещё не создана.'}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div id="qx-hidden"></div>
    <div class="of">
        <div class="of-main">
            <section class="card of-sec" aria-labelledby="qx-h1"><div class="card-h"><h2 id="qx-h1"><span class="step">1</span> Дата документа для 1С</h2><p>по умолчанию — сегодня</p></div><div class="card-b">
                <div class="qx-date"><input class="inp" type="date" id="qx-doc" name="date" aria-label="Дата документа для 1С"><span class="hint" id="qx-dt"></span></div></div></section>
            <section class="card of-sec" aria-labelledby="qx-h2"><div class="card-h"><h2 id="qx-h2"><span class="step">2</span> Что выпускаем</h2><p>только изделия с рецептурой</p></div>
                <div class="card-b" style="padding-bottom:0"><div class="qx-lines" id="qx-lines"></div></div>
                <button class="add" type="button" id="qx-add"><th:block th:utext="${i['plus']}"></th:block><span>Добавить изделие</span></button></section>
        </div>
        <aside class="card of-sum" id="qx-sum" aria-label="Итог заявки"></aside>
    </div>
</form>
</th:block>
<th:block th:fragment="scripts">
<script type="application/json" id="qx-data" th:utext="${formJson}"></script>
<script src="/admin/assets/ops.js?v=1"></script>
<script src="/admin/assets/req-form.js?v=1"></script>
</th:block>
</body>
</html>
