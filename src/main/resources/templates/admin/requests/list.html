<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{::scripts})}">
<body>
<th:block th:fragment="content">
<div class="kpis kpis--3">
    <a th:each="t : ${tiles}" class="kpi" th:classappend="${t.cls}" th:href="${t.href}"><span class="kpi-l"><th:block th:utext="${i[t.icon]}"></th:block><th:block th:text="${t.label}"></th:block></span>
        <span class="kpi-v" th:text="${t.value}">0</span><span class="kpi-s" th:text="${t.sub}"></span></a>
</div>
<form class="tools" method="get" action="/admin/requests" data-autosubmit>
    <input type="hidden" name="st" th:value="${st}">
    <label class="search"><span class="sr">Поиск заявки</span><th:block th:utext="${i['search']}"></th:block>
        <input class="inp" name="q" type="search" placeholder="№ заявки, группа или изделие" autocomplete="off" th:value="${q}"></label>
    <label class="pick"><span class="sr">Дата документа</span><select class="sel" name="per">
        <option th:each="o : ${periods}" th:value="${o.value}" th:text="${o.label}" th:selected="${o.on}"></option></select></label>
    <noscript><button class="btn btn-soft btn-sm" type="submit">Показать</button></noscript>
    <span class="grow"></span>
    <button class="btn btn-soft btn-sm" type="button" id="rq-mg">Общая рецептура</button>
    <a class="btn btn-soft btn-sm" href="/admin/requests/report.pdf" target="_blank" rel="noopener"><th:block th:utext="${i['print']}"></th:block><span>Отчёт за день</span></a>
    <a th:if="${canCreate}" class="btn btn-primary btn-sm" href="/admin/requests/new"><th:block th:utext="${i['plus']}"></th:block><span>Новая заявка</span></a>
</form>
<div class="chips" role="group" aria-label="Статус заявки">
    <a th:each="c : ${chips}" class="chip" th:classappend="${c.alert} ? 'chip--alert'" th:href="${c.href}" th:attr="aria-pressed=${c.on}"><th:block th:text="${c.label}"></th:block> <span th:text="${c.count}"></span></a>
</div>
<section class="card" aria-label="Заявки на сырьё"><div class="tbl-w">
    <div th:if="${rows.isEmpty()}" class="empty">Заявок не найдено.</div>
    <table th:unless="${rows.isEmpty()}" class="tbl tbl--q">
        <thead><tr><th>№</th><th>Заявка</th><th class="r">Замесов</th><th class="r">План, шт</th><th>На что смотреть</th><th>Статус</th></tr></thead>
        <tbody><tr th:each="w : ${rows}" class="rowlink" th:classappend="${w.quiet()} ? 'is-quiet'" th:attr="data-href=${'/admin/requests/' + w.r.id}">
            <td class="q-no"><a th:href="${'/admin/requests/' + w.r.id}" th:text="${w.r.id}">150</a><small th:text="${@fmt.dm(w.r.documentDate)}"></small></td>
            <td class="q-t"><b th:text="${w.r.title}">Кексы</b><small><th:block th:each="p, s : ${w.parts}"><th:block th:if="${!s.first}"> · </th:block><th:block th:text="${p.name() + ' '}"></th:block><span class="q-bn" th:text="${@fmt.qn(p.batches())}"></span></th:block><th:block th:if="${w.extra > 0}" th:text="${' · сверх заявки ' + w.extra}"></th:block></small></td>
            <td class="r num q-b"><th:block th:text="${@fmt.qn(w.batches)}"></th:block><span class="mob" th:text="${' ' + w.batchesWord()}"></span></td>
            <td class="r num q-p"><b><span class="mob">план </span><th:block th:text="${@fmt.num(w.plan)}"></th:block></b><small th:text="${w.got > 0 ? 'факт ' + @fmt.num(w.fact) + (w.got < w.main ? ' · ' + w.got + ' из ' + w.main : '') : 'факта нет'}"></small></td>
            <td class="q-f"><span th:each="f : ${w.flags}" th:class="${f.cls}" th:text="${f.text}"></span><span th:if="${w.flags.isEmpty()}" class="muted" th:text="${w.r.items.size() + ' поз. сырья'}"></span></td>
            <td class="q-st"><span class="st" th:classappend="${w.badge.cls}"><th:block th:utext="${i16[w.badge.icon]}"></th:block><span th:text="${w.badge.label}"></span></span><small th:text="${w.next}"></small></td>
        </tr></tbody>
    </table>
</div></section>
<p class="cnt" th:text="${'Заявок: ' + rows.size() + '. Новые, собранные и не завершённые видны всегда, остальные — по дате документа для 1С.'}"></p>
</th:block>
<th:block th:fragment="scripts">
<script type="application/json" id="rq-merge" th:utext="${mergeJson}"></script>
<script src="/admin/assets/ops.js?v=1"></script>
<script src="/admin/assets/req.js?v=1"></script>
</th:block>
</body>
</html>
