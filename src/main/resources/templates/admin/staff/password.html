<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{::scripts})}">
<body>
<th:block th:fragment="content">
<a class="back" th:href="${canUsers ? '/admin/staff/users' : '/admin'}"><th:block th:utext="${i['back']}"></th:block><th:block th:text="${canUsers ? 'Входы в CRM' : 'Назад'}"></th:block></a>
<section class="card card-b pw-card"><h2 class="pf-h">Свой пароль</h2>
    <p class="hint">Пароль один и для админки на компьютере, и для приложения на телефоне.</p>
    <form class="fgrid fgrid--2 pw-f" id="pwf" method="post" action="/admin/me/password" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label class="field wide"><span>Текущий пароль</span><input class="inp" id="pw-c" name="current" type="password" autocomplete="current-password"></label>
        <label class="field"><span>Новый пароль</span><input class="inp" id="pw-n" name="password" type="password" autocomplete="new-password"><small class="hint">не короче 6 знаков</small></label>
        <label class="field"><span>Ещё раз</span><input class="inp" id="pw-r" name="repeat" type="password" autocomplete="new-password"></label>
        <p class="errs wide" id="pw-e" hidden></p>
        <div class="form-acts wide"><button class="btn btn-primary" type="submit">Сменить пароль</button></div>
    </form></section>
</th:block>
<th:block th:fragment="scripts">
<script src="/admin/assets/ops.js?v=1"></script>
<script src="/admin/assets/team.js?v=1"></script>
</th:block>
</body>
</html>
