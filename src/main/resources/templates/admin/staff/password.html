<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
<form method="post" action="/admin/me/password" style="max-width:520px">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <section class="card form-card">
        <p class="muted">Пароль один и для админки, и для приложения на телефоне.</p>
        <label class="field"><span>Текущий пароль</span><input class="inp" name="current" type="password" required autocomplete="current-password"></label>
        <label class="field"><span>Новый пароль</span><input class="inp" name="password" type="password" required minlength="6" autocomplete="new-password"></label>
        <label class="field"><span>Ещё раз</span><input class="inp" name="repeat" type="password" required minlength="6" autocomplete="new-password"></label>
        <div class="form-acts"><a class="btn btn-soft" href="/admin">Отмена</a><button class="btn btn-primary" type="submit">Сменить пароль</button></div>
    </section>
</form>
</th:block>
</body>
</html>
