<!DOCTYPE html>
<!--/* Карта на замес для бригады (batchSheet из макета): сырьё на n замесов с квадратиками для отметки, закладка и
     выход, этапы с фактом по ККТ, подписи. A4, своя страница без меню админки. */-->
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${'Карта на замес — ' + t.name + ' — Админка Юг Сладости'}">Карта на замес</title>
    <link rel="icon" href="/admin/assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vollkorn:wght@700;800&family=Golos+Text:wght@400;500;600;700&display=swap">
    <style>
        :root{--ink:#2A1712;--ink-soft:#6B564B;--line:rgba(42,23,18,.14);--paper:#F3F2E9;--crimson:#B9203C;--crimson-deep:#96172E;--yolk:#FFC646;
            --display:"Vollkorn","PT Serif",Georgia,serif;--body:"Golos Text","Segoe UI",system-ui,sans-serif}
        *{box-sizing:border-box}
        body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
        .bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
        .bar a{color:var(--crimson-deep);font-weight:600;text-decoration:underline;text-underline-offset:3px}
        .bar form{display:flex;align-items:center;gap:8px;margin:0}
        .bar label{color:var(--ink-soft);font-size:13.5px}
        .bar input{width:72px;height:40px;padding:0 10px;border:1.5px solid rgba(42,23,18,.28);border-radius:12px;font:600 16px/1 var(--body);text-align:right}
        .btn{display:inline-flex;align-items:center;min-height:40px;padding:0 18px;border:0;border-radius:999px;background:var(--crimson);color:#fff;font:600 15px/1 var(--body);box-shadow:0 3px 0 var(--crimson-deep);cursor:pointer}
        .btn--soft{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(42,23,18,.28)}
        .sheets{display:grid;justify-items:center;padding:24px 16px 48px}
        .sheet{width:min(210mm,100%);padding:14mm 14mm 12mm;background:#fff;box-shadow:0 18px 40px -26px rgba(80,40,0,.55)}
        .sheet h1{margin:0;font:800 26px/1.15 var(--display)}
        .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:14px}
        .head p{margin:4px 0 0;color:var(--ink-soft)}
        .when{font-size:13px;color:var(--ink-soft)}
        table{width:100%;border-collapse:collapse;font-size:14px}
        th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
        th{font:600 11.5px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
        .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
        .box-c{width:28px}
        .box-c i{display:inline-block;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:4px;vertical-align:-3px}
        tfoot td{font-weight:700;border-bottom:0;border-top:1.5px solid var(--ink)}
        .out{margin:12px 0 4px;font-size:15px}
        h2{margin:18px 0 6px;font:700 18px/1.2 var(--display)}
        ol{display:grid;gap:0;margin:0;padding:0;list-style:none}
        li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
        li:first-child{border-top:0}
        .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper);font-weight:700;font-size:12.5px}
        .ccp .n{background:var(--yolk)}
        .t{font-weight:600}
        .tag{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:5px;background:var(--yolk);font:700 11px/1.4 var(--body);letter-spacing:.06em}
        .d{color:var(--ink-soft)}
        .fact{margin-top:4px;font-weight:600}
        .sign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:26px;font-size:13px;color:var(--ink-soft)}
        .sign span{display:block;margin-top:28px;border-top:1px solid var(--ink)}
        .muted{color:var(--ink-soft)}
        @media (max-width:560px){.sheet{padding:18px 14px}.sign{grid-template-columns:minmax(0,1fr)}}
        @page{size:A4;margin:12mm}
        @media print{
            body{background:#fff}
            .bar{display:none}
            .sheets{display:block;padding:0}
            .sheet{width:auto;padding:0;box-shadow:none}
        }
    </style>
</head>
<body>
<div class="bar">
    <a th:href="${'/admin/techcards/' + t.productId}" th:text="${'← Техкарта: ' + t.name}">← Техкарта</a>
    <form method="get" th:action="${'/admin/techcards/' + t.productId + '/sheet'}"><label for="sh-n">Замесов</label><input id="sh-n" name="n" inputmode="numeric" maxlength="2" th:value="${n}"><button class="btn btn--soft" type="submit">Пересчитать</button></form>
    <button class="btn" type="button" onclick="window.print()">Печать</button>
</div>
<div class="sheets">
<section class="sheet">
    <div class="head">
        <div><h1 th:text="${'Карта на замес — ' + t.name}">Карта на замес</h1>
            <p th:text="${@fmt.count(n, 'замес', 'замеса', 'замесов') + (t.group != null ? ' · ' + t.group : '') + (t.draft ? ' · техкарта-черновик — для пробного замеса' : '')}"></p></div>
        <span class="when">Дата: ____.____.______ · смена ________</span>
    </div>
    <table>
        <thead><tr><th class="box-c"></th><th>Сырьё</th><th class="r" th:text="${'На ' + @fmt.count(n, 'замес', 'замеса', 'замесов')}">На 1 замес</th><th class="r">Факт</th></tr></thead>
        <tbody><tr th:each="x : ${c.rows}"><td class="box-c"><i></i></td><td th:text="${x.name}">Мука</td>
            <td class="r"><b th:text="${@fmt.num(x.qty.multiply(nb)) + ' ' + x.unit}">12 кг</b></td><td class="r muted">________</td></tr></tbody>
        <tfoot th:if="${c.allMass}"><tr><td></td><td>Закладка</td><td class="r" th:text="${@fmt.fix(c.batchKg.multiply(nb), 3) + ' кг'}"></td><td></td></tr></tfoot>
    </table>
    <p class="out" th:if="${outQty != null}">Выход: <b th:text="${@fmt.num(outQty) + ' ' + t.unit}"></b><th:block th:if="${outBoxes != null}" th:text="${' → ' + outBoxes + ' кор.' + (outRest > 0 ? ' + ' + outRest + ' ' + t.unit : '')}"></th:block></p>
    <h2 th:unless="${t.stages.isEmpty()}">Этапы</h2>
    <ol th:unless="${t.stages.isEmpty()}">
        <li th:each="s, it : ${t.stages}" th:classappend="${s.ccp} ? 'ccp'"><span class="n" th:text="${it.count}">1</span><div>
            <p class="t" style="margin:0"><th:block th:text="${s.title}"></th:block><span th:if="${s.ccp}" class="tag">ККТ</span></p>
            <p class="d" style="margin:2px 0 0" th:if="${(s.temperature != null and !#strings.isEmpty(s.temperature)) or (s.duration != null and !#strings.isEmpty(s.duration))}"
               th:text="${(s.temperature != null and !#strings.isEmpty(s.temperature) ? 't° ' + s.temperature : '') + ((s.temperature != null and !#strings.isEmpty(s.temperature)) and (s.duration != null and !#strings.isEmpty(s.duration)) ? ' · ' : '') + (s.duration != null and !#strings.isEmpty(s.duration) ? 'время ' + s.duration : '')}"></p>
            <p class="fact" style="margin:4px 0 0" th:if="${s.ccp}">Факт: ________________</p></div></li>
    </ol>
    <div class="sign"><div>Замес начат<span></span></div><div>Выпуск закончен<span></span></div><div>Бригадир<span></span></div></div>
</section>
</div>
</body>
</html>
