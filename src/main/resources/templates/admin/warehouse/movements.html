<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
<a class="back" th:href="${base}"><th:block th:utext="${i['back']}"></th:block><th:block th:text="${product ? 'Склад' : 'Склад сырья'}"></th:block></a>
<form class="tools" method="get" th:action="${base + '/movements'}" data-autosubmit>
    <label class="search"><span class="sr">Поиск</span><th:block th:utext="${i['search']}"></th:block>
        <input class="inp" name="q" type="search" th:placeholder="${product ? 'Товар' : 'Сырьё'}" autocomplete="off" th:value="${q}"></label>
    <label class="pick"><span class="sr">Вид</span><select class="sel" name="type">
        <option value="all" th:selected="${type == 'all'}">Все движения</option><option value="in" th:selected="${type == 'in'}">Поступления</option><option value="out" th:selected="${type == 'out'}">Списания</option></select></label>
    <label class="pick"><span class="sr">С</span><input class="inp" type="date" name="from" th:value="${from}"></label>
    <label class="pick"><span class="sr">По</span><input class="inp" type="date" name="to" th:value="${to}"></label>
</form>
<section class="card" aria-label="Движения">
    <div class="tbl-w">
        <div th:if="${rows.isEmpty()}" class="empty">За эти дни движений нет.</div>
        <table th:unless="${rows.isEmpty()}" class="tbl tbl--cards">
            <thead><tr><th>Когда</th><th th:text="${product ? 'Товар' : 'Сырьё'}"></th><th>Вид</th><th class="r">Количество</th><th>Причина</th><th>Кто</th><th>1С</th><th class="acts-col" th:if="${isAdmin}"></th></tr></thead>
            <tbody>
            <tr th:each="m : ${rows}">
                <td th:text="${@fmt.when(m.createdAt)}"></td>
                <td class="c-full"><b th:text="${m.product != null ? m.product.name : m.ingredient.name}"></b></td>
                <td><span class="tag" th:classappend="${m.type.name() == 'RECEIPT'} ? 'tag--ok' : 'tag--bad'" th:text="${m.type.label}"></span></td>
                <td class="r num" th:text="${(m.type.name() == 'RECEIPT' ? '+' : '−') + @fmt.num(m.quantity) + ' ' + (m.product != null ? (m.product.unit != null ? m.product.unit : 'шт') : m.ingredient.unit)}"></td>
                <td class="c-full" th:text="${m.reason}"></td>
                <td th:text="${m.createdBy}"></td>
                <td th:text="${m.document != null and m.document.oneCDocumentNumber != null ? m.document.oneCDocumentNumber : (m.oneCDocumentNumber != null ? m.oneCDocumentNumber : '—')}"></td>
                <td th:if="${isAdmin}"><form th:action="${base + '/movements/' + m.id + '/delete'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="ibtn" type="submit" aria-label="Удалить движение" th:utext="${i['trash']}" data-confirm="Движение удалится, остаток пересчитается обратно." data-confirm-title="Удалить движение?" data-confirm-ok="Удалить"></button></form></td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</th:block>
</body>
</html>
