<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
<a class="back" href="/admin/clients"><th:block th:utext="${i['back']}"></th:block>Клиенты</a>
<section class="card"><div class="tbl-w">
    <div th:if="${rows.isEmpty()}" class="empty">Новых заявок на доступ нет.</div>
    <table th:unless="${rows.isEmpty()}" class="tbl tbl--cards"><thead><tr><th><span class="th-m">Телефон<th:block th:replace="~{admin/mask :: btn('phones')}"></th:block></span></th><th>Имя</th><th>Когда</th><th class="acts-col"></th></tr></thead>
    <tbody><tr th:each="r : ${rows}"><td class="num"><b class="phn" th:text="${@fmt.phone(r.phone)}"></b></td><td th:text="${r.name}"></td><td th:text="${@fmt.when(r.createdAt)}"></td>
        <td><div class="tbl-actions">
            <form th:action="${'/admin/clients/access/' + r.id + '/approve'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-primary btn-sm" type="submit">Разрешить</button></form>
            <form th:action="${'/admin/clients/access/' + r.id + '/reject'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-soft btn-sm" type="submit">Отклонить</button></form></div></td></tr></tbody></table>
</div></section>
<p class="cnt">«Разрешить» создаёт клиента с этим телефоном — покупатель сразу входит в магазин.</p>
</th:block>
</body>
</html>
