<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
<a class="back" href="/admin/clients"><th:block th:utext="${i['back']}"></th:block>Клиенты</a>
<section class="card"><div class="tbl-w">
    <div th:if="${rows.isEmpty()}" class="empty">Долгов нет.</div>
    <table th:unless="${rows.isEmpty()}" class="tbl tbl--cards"><thead><tr><th>Заказ</th><th>Клиент</th><th class="r">Сумма</th><th>Срок оплаты</th><th class="acts-col"></th></tr></thead>
    <tbody><tr th:each="o : ${rows}"><td><a th:href="${'/admin/orders/' + o.id}" th:text="${'№ ' + o.id}"></a></td><td class="c-full"><b th:text="${o.client.name}"></b></td>
        <td class="r num"><b th:text="${@fmt.money(o.netTotal)}"></b></td>
        <td th:classappend="${o.debtDueDate.isBefore(today)} ? 'pay-bad'" th:text="${@fmt.date(o.debtDueDate) + (o.debtDueDate.isBefore(today) ? ' — просрочен' : '')}"></td>
        <td><form th:if="${canPay}" th:action="${'/admin/clients/debts/' + o.id + '/paid'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-soft btn-sm" type="submit">Оплачено</button></form></td></tr></tbody>
    <tfoot><tr><td colspan="2">Итого</td><td class="r num" th:text="${@fmt.money(sum)}"></td><td colspan="2"></td></tr></tfoot></table>
</div></section>
</th:block>
</body>
</html>
