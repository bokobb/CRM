<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Товары — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div>
                <h1>Товары</h1>
                <p class="subtitle" th:text="${#lists.size(products)} + ' товаров в каталоге'"></p>
            </div>
            <a class="btn primary" th:href="@{/products/new}">+ Новый товар</a>
        </div>

        <div class="alert warn" th:if="${info}" th:text="${info}"></div>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <input type="text" id="crm-product-search" class="product-search"
               placeholder="Поиск товара по названию…" oninput="crmFilterProducts()"
               th:if="${not #lists.isEmpty(products)}">

        <div th:each="entry : ${productsByCategory}" class="category-section">
            <h2>
                <span th:text="${entry.key}"></span>
                <span class="category-count" th:text="'· ' + ${#lists.size(entry.value)}"></span>
            </h2>
            <div class="product-grid">
                <div class="product-card" th:each="p : ${entry.value}" th:classappend="${!p.active} ? 'product-card-archived'" th:attr="data-name=${#strings.toLowerCase(p.name)}">
                    <img th:if="${p.imageUrl != null and not #strings.isEmpty(p.imageUrl)}"
                         th:src="${p.imageUrl}" th:alt="${p.name}" class="product-card-img">
                    <div th:unless="${p.imageUrl != null and not #strings.isEmpty(p.imageUrl)}"
                         class="product-card-avatar" th:text="${#strings.substring(p.name, 0, 1)}"></div>
                    <div class="product-card-body">
                        <div class="product-card-name">
                            <span th:text="${p.name}"></span>
                            <span class="badge PENDING" th:if="${!p.active}">Архивный</span>
                            <span class="badge PENDING" th:if="${p.active and !p.visibleToClients}"
                                  th:text="${p.hiddenFromClientsUntil != null} ? 'Скрыт от клиентов до ' + ${#temporals.format(p.hiddenFromClientsUntil, 'dd.MM.yyyy')} : 'Скрыт от клиентов'"></span>
                        </div>
                        <div class="product-card-price" th:text="${p.price} + ' ₸'"></div>
                        <div class="product-card-department"
                             th:text="${departmentNames.get(p.oneCDepartmentKey)} ?: 'Подразделение не задано'"></div>
                    </div>
                    <div class="product-card-actions">
                        <a class="btn small" th:href="@{/products/{id}/edit(id=${p.id})}">Изменить</a>
                        <form th:if="${p.active}" sec:authorize="hasRole('ADMIN')"
                              th:action="@{/products/{id}/delete(id=${p.id})}" method="post" onsubmit="return confirm('Удалить товар? Если он уже встречался в заказах или на складе — вместо удаления он будет архивирован.');">
                            <button class="btn small danger" type="submit">Удалить</button>
                        </form>
                        <form th:unless="${p.active}" sec:authorize="hasRole('ADMIN')"
                              th:action="@{/products/{id}/restore(id=${p.id})}" method="post">
                            <button class="btn small" type="submit">Восстановить</button>
                        </form>
                        <form th:if="${p.active and p.visibleToClients}" sec:authorize="hasRole('ADMIN')"
                              th:action="@{/products/{id}/hide-from-clients(id=${p.id})}" method="post"
                              title="Товар пропадёт с витрины и из разбора заказов WhatsApp; сотрудники продолжат его видеть">
                            <input type="date" name="until" title="По какую дату скрыть (пусто — пока не вернёте вручную)"
                                   style="width:auto">
                            <button class="btn small" type="submit">Скрыть от клиентов</button>
                        </form>
                        <form th:if="${p.active and !p.visibleToClients}" sec:authorize="hasRole('ADMIN')"
                              th:action="@{/products/{id}/show-to-clients(id=${p.id})}" method="post">
                            <button class="btn small" type="submit">Показать клиентам</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <p class="empty" th:if="${#lists.isEmpty(products)}">Товаров пока нет</p>
        <p class="empty" id="crm-product-empty" style="display:none">Ничего не найдено</p>
    </main>
</div>
<script th:inline="none">
    function crmFilterProducts() {
        var q = document.getElementById('crm-product-search').value.trim().toLowerCase();
        var totalVisible = 0;
        document.querySelectorAll('.category-section').forEach(function (section) {
            var visibleInSection = 0;
            section.querySelectorAll('.product-card').forEach(function (card) {
                var match = card.getAttribute('data-name').indexOf(q) !== -1;
                card.style.display = match ? '' : 'none';
                if (match) visibleInSection++;
            });
            section.style.display = visibleInSection > 0 ? '' : 'none';
            totalVisible += visibleInSection;
        });
        document.getElementById('crm-product-empty').style.display = totalVisible === 0 ? '' : 'none';
    }
</script>
</body>
</html>
