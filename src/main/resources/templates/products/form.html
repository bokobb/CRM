<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Товар — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <h1 th:text="${product.id} != null ? 'Редактировать товар' : 'Новый товар'">Товар</h1>

        <form class="panel" th:action="@{/products}" th:object="${product}" method="post" enctype="multipart/form-data" style="max-width:520px">
            <input type="hidden" th:field="*{id}">
            <div class="field">
                <label>Название</label>
                <input type="text" th:field="*{name}" required>
            </div>
            <div class="row">
                <div class="field">
                    <label>Категория</label>
                    <input type="text" th:field="*{category}" placeholder="Торты, капкейки, печенье...">
                </div>
                <div class="field">
                    <label>Цена, ₸</label>
                    <input type="number" step="0.01" th:field="*{price}" required>
                </div>
            </div>
            <div class="row">
                <div class="field">
                    <label>Группа</label>
                    <input type="text" th:field="*{group}" placeholder="Коржик, Орешки...">
                </div>
                <div class="field">
                    <label>Ед. изм.</label>
                    <input type="text" th:field="*{unit}" placeholder="шт, кг...">
                </div>
            </div>
            <div class="field">
                <label>Вес 1 шт, г</label>
                <input type="number" step="0.001" min="0" th:field="*{netWeightGrams}" placeholder="Необязательно">
                <small style="color:var(--muted)">Только для товаров, где норму при оприходовании нужно сверять по
                    общей массе группы, а не по штукам (например, разные фасовки одного замеса, см. заявку на сырьё)</small>
            </div>
            <div class="field">
                <label style="display:flex;align-items:center;gap:8px;font-weight:normal">
                    <input type="checkbox" th:field="*{massReferenceProduct}" style="width:auto">
                    Эталон для пересчёта массы в штуки — в заявке на сырьё «не хватает N кг» переведётся
                    в «≈ M шт. этого товара» (должен быть максимум один такой товар в группе, с заданным весом выше)
                </label>
            </div>
            <div class="field">
                <label>Подразделение в 1С (корпус)</label>
                <select th:field="*{oneCDepartmentKey}">
                    <option value="">Не задано (используется общее по умолчанию)</option>
                    <option th:each="entry : ${departments}" th:value="${entry.key}" th:text="${entry.value}"></option>
                </select>
            </div>
            <div class="field">
                <label>Описание</label>
                <textarea th:field="*{description}"></textarea>
            </div>
            <div class="field">
                <label style="display:flex;align-items:center;gap:8px;font-weight:normal">
                    <input type="checkbox" th:field="*{semiFinished}" style="width:auto">
                    Полуфабрикат (заготовка вроде «Пряник») — не в витрине заказов и «Остатках»,
                    остаток учитывается как сырьё, в 1С уходит на склад сырья
                </label>
            </div>
            <div class="field" th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}">
                <label>Текущее фото</label>
                <img th:src="${product.imageUrl}" alt="Фото товара" style="max-width:200px;max-height:200px;border-radius:8px">
            </div>
            <div class="field">
                <label>Ссылка на фото</label>
                <input type="url" th:field="*{imageUrl}" placeholder="https://...">
            </div>
            <div class="field">
                <label>Загрузить фото с телефона/компьютера</label>
                <input type="file" name="imageFile" accept="image/*">
            </div>
            <div class="actions">
                <button class="btn primary" type="submit">Сохранить</button>
                <a class="btn" th:href="@{/products}">Отмена</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
