<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Товар — Кондитерская CRM</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <h1 th:text="${product.id} != null ? 'Редактировать товар' : 'Новый товар'">Товар</h1>

        <form class="panel" th:action="@{/products}" th:object="${product}" method="post" style="max-width:520px">
            <input type="hidden" th:field="*{id}">
            <div class="field">
                <label>Название</label>
                <input type="text" th:field="*{name}" required>
            </div>
            <div class="row">
                <div class="field">
                    <label>Категория</label>
                    <input type="text" th:field="*{category}" placeholder="Торты, капкейки, печенье...">
                </div>
                <div class="field">
                    <label>Цена, ₽</label>
                    <input type="number" step="0.01" th:field="*{price}" required>
                </div>
            </div>
            <div class="field">
                <label>Описание</label>
                <textarea th:field="*{description}"></textarea>
            </div>
            <div class="actions">
                <button class="btn primary" type="submit">Сохранить</button>
                <a class="btn" th:href="@{/products}">Отмена</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
