<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Рецепты — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div>
                <h1>Рецепты</h1>
                <p class="subtitle" th:text="${#lists.size(products)} + ' товаров в каталоге'"></p>
            </div>
            <form method="post" th:action="@{/products/import-recipes-1c}" sec:authorize="hasRole('ADMIN')"
                  onsubmit="return confirm('Перезаписать рецептуры данными из 1С там, где найдётся спецификация? Существующие рецепты будут заменены.');"
                  style="display:inline">
                <button type="submit" class="btn">Импортировать рецепты из 1С</button>
            </form>
            <form method="post" th:action="@{/products/import-departments-1c}" sec:authorize="hasRole('ADMIN')"
                  onsubmit="return confirm('Определить подразделение (Корпус А/B/С/D) для каждого товара по истории документов в 1С?');"
                  style="display:inline">
                <button type="submit" class="btn">Импортировать подразделения из 1С</button>
            </form>
            <form method="post" th:action="@{/products/import-specifications-1c}" sec:authorize="hasRole('ADMIN')"
                  onsubmit="return confirm('Заполнить GUID спецификации для каждого товара из 1С? Состав рецептов (сырьё/количества) не меняется, только GUID.');"
                  style="display:inline">
                <button type="submit" class="btn">Импортировать спецификации из 1С</button>
            </form>
        </div>

        <div class="alert success" th:if="${success}" th:text="${success}"></div>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <input type="text" id="crm-product-search" class="product-search"
               placeholder="Поиск товара по названию…" oninput="crmFilterProducts()"
               th:if="${not #lists.isEmpty(products)}">

        <div th:each="entry : ${productsByGroup}" class="category-section">
            <h2>
                <span th:text="${entry.key}"></span>
                <span class="category-count" th:text="'· ' + ${#lists.size(entry.value)}"></span>
            </h2>
            <div class="product-grid">
                <div class="product-card" th:each="p : ${entry.value}" th:classappend="${!p.active} ? 'product-card-archived'" th:attr="data-name=${#strings.toLowerCase(p.name)}">
                    <img th:if="${p.imageUrl != null and not #strings.isEmpty(p.imageUrl)}"
                         th:src="${p.imageUrl}" th:alt="${p.name}" class="product-card-img">
                    <div th:unless="${p.imageUrl != null and not #strings.isEmpty(p.imageUrl)}"
                         class="product-card-avatar" th:text="${#strings.substring(p.name, 0, 1)}"></div>
                    <div class="product-card-body">
                        <div class="product-card-name">
                            <span th:text="${p.name}"></span>
                            <span class="badge PENDING" th:if="${!p.active}">Архивный</span>
                        </div>
                        <div class="product-card-price" th:text="${p.price} + ' ₸'"></div>
                    </div>
                    <div class="product-card-actions">
                        <a class="btn small" th:href="@{/products/{id}/recipe(id=${p.id})}">Рецептура</a>
                    </div>
                </div>
            </div>
        </div>

        <p class="empty" th:if="${#lists.isEmpty(products)}">Товаров пока нет</p>
        <p class="empty" id="crm-product-empty" style="display:none">Ничего не найдено</p>
    </main>
</div>
<script th:inline="none">
    function crmFilterProducts() {
        var q = document.getElementById('crm-product-search').value.trim().toLowerCase();
        var totalVisible = 0;
        document.querySelectorAll('.category-section').forEach(function (section) {
            var visibleInSection = 0;
            section.querySelectorAll('.product-card').forEach(function (card) {
                var match = card.getAttribute('data-name').indexOf(q) !== -1;
                card.style.display = match ? '' : 'none';
                if (match) visibleInSection++;
            });
            section.style.display = visibleInSection > 0 ? '' : 'none';
            totalVisible += visibleInSection;
        });
        document.getElementById('crm-product-empty').style.display = totalVisible === 0 ? '' : 'none';
    }
</script>
</body>
</html>
