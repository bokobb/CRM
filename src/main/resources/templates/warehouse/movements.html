<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isReceipt ? 'Поступления' : 'Списание'} + ' — Юг Сладости'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div>
                <h1 th:text="${isReceipt ? 'Поступления' : 'Списание'}"></h1>
                <p class="subtitle" th:text="${kind == 'PRODUCT'
                        ? (isReceipt ? 'Приход готовой продукции на склад' : 'Списание порчи, недостачи и т.п. готовой продукции')
                        : (isReceipt ? 'Приход сырья на склад' : 'Списание порчи, недостачи и т.п. сырья')}"></p>
            </div>
            <form th:if="${isReceipt and kind == 'PRODUCT'}" method="post" th:action="@{/warehouse/receipts/post-1c}"
                  sec:authorize="hasAnyRole('ADMIN','WAREHOUSE_FG')"
                  onsubmit="return confirm('Собрать все сегодняшние ручные поступления товара в один документ и провести в 1С на 06:00? (приход от заявок на производство сюда не входит — он выгружается сам)');">
                <button type="submit" class="btn">Общее оприходование</button>
            </form>
        </div>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <div class="alert success" th:if="${success}" th:text="${success}"></div>

        <form class="panel" th:action="@{${isReceipt ? receiptsUrl : writeoffsUrl}}"
              method="post" style="max-width:520px">
            <h2 th:text="${isReceipt ? 'Новое поступление' : 'Новое списание'}"></h2>

            <div class="field" th:if="${kind == 'INGREDIENT'}">
                <label>Сырьё</label>
                <select name="ingredientId" required>
                    <option value="">— выберите сырьё —</option>
                    <option th:each="i : ${ingredients}" th:value="${i.id}"
                            th:text="${i.name} + ' (' + ${i.quantityInStock} + ' ' + ${i.unit} + ')'"></option>
                </select>
            </div>
            <div class="field" th:if="${kind == 'PRODUCT'}">
                <label>Товар</label>
                <select name="productId" required>
                    <option value="">— выберите товар —</option>
                    <option th:each="p : ${products}" th:value="${p.id}"
                            th:text="${p.name} + ' (' + ${p.quantityInStock} + ' ' + ${p.unit ?: 'шт'} + ')'"></option>
                </select>
            </div>

            <div class="row">
                <div class="field">
                    <label>Количество</label>
                    <input type="number" step="0.001" min="0.001" name="quantity" required>
                </div>
                <div class="field">
                    <label th:text="${isReceipt ? 'Причина (поставщик и т.п.)' : 'Причина (порча, недостача...)'}"></label>
                    <input type="text" name="reason">
                </div>
            </div>

            <button class="btn primary" type="submit" th:text="${isReceipt ? 'Оприходовать' : 'Списать'}"></button>
        </form>

        <div class="panel">
            <h2>История</h2>
            <form method="get" class="row" style="align-items:flex-end;margin-bottom:14px">
                <div class="field" style="margin:0">
                    <label>С даты</label>
                    <input type="date" name="from" th:value="${from}">
                </div>
                <div class="field" style="margin:0">
                    <label>По дату</label>
                    <input type="date" name="to" th:value="${to}">
                </div>
                <div class="field" style="margin:0;flex:2">
                    <label>Название</label>
                    <input type="text" name="q" th:value="${q}" th:placeholder="${kind == 'PRODUCT' ? 'Товар...' : 'Сырьё...'}">
                </div>
                <button class="btn small" type="submit">Найти</button>
                <a class="btn small" th:if="${from != null or to != null or (q != null and !#strings.isEmpty(q))}"
                   th:href="@{${isReceipt ? receiptsUrl : writeoffsUrl}}">Сбросить</a>
            </form>
            <table th:if="${not #lists.isEmpty(movements)}">
                <tr><th>Дата</th><th>Позиция</th><th>Количество</th><th>Причина</th><th>Кто</th><th></th></tr>
                <tr th:each="m : ${movements}">
                    <td th:text="${#temporals.format(m.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${m.product != null ? m.product.name : m.ingredient.name}"></td>
                    <td th:text="${isReceipt ? '+' : '−'} + ${m.quantity} + ' ' + ${m.product != null ? (m.product.unit ?: 'шт') : m.ingredient.unit}"></td>
                    <td th:text="${m.reason}"></td>
                    <td th:text="${m.createdBy}"></td>
                    <td>
                        <form th:action="@{/warehouse/movements/{id}/delete(id=${m.id})}" method="post"
                              onsubmit="return confirm('Удалить это движение? Остаток на складе будет пересчитан обратно.');">
                            <button class="btn small danger" type="submit">Удалить</button>
                        </form>
                    </td>
                </tr>
            </table>
            <p class="empty" th:if="${#lists.isEmpty(movements)}">Записей пока нет</p>
        </div>
    </main>
</div>
</body>
</html>
