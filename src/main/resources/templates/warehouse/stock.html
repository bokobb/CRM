<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Остатки — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Остатки</h1><p class="subtitle">Готовая продукция на складе ГП</p></div>
            <form method="post" th:action="@{/warehouse/stock/sync-1c}" sec:authorize="hasRole('ADMIN')">
                <button type="submit" class="btn">Синхронизировать с 1С</button>
            </form>
        </div>

        <div class="alert success" th:if="${success}" th:text="${success}"></div>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <input type="text" id="crm-product-search" class="product-search"
               placeholder="Поиск товара по названию…" oninput="crmFilterProducts()"
               th:if="${not #lists.isEmpty(products)}">

        <div class="sort-toolbar" th:if="${not #lists.isEmpty(products)}">
            <button type="button" class="btn small" onclick="crmCycleProductSort()">
                Сортировка: <span id="crm-product-sort-label"></span>
            </button>
        </div>

        <div th:each="entry : ${productsByCategory}" class="category-section">
            <h2>
                <span th:text="${entry.key}"></span>
                <span class="category-count" th:text="'· ' + ${#lists.size(entry.value)}"></span>
            </h2>
            <div class="product-grid">
                <div class="product-card" th:each="p : ${entry.value}"
                     th:attr="data-name=${#strings.toLowerCase(p.name)},data-qty=${p.quantityInStock}">
                    <img th:if="${p.imageUrl != null and not #strings.isEmpty(p.imageUrl)}"
                         th:src="${p.imageUrl}" th:alt="${p.name}" class="product-card-img">
                    <div th:unless="${p.imageUrl != null and not #strings.isEmpty(p.imageUrl)}"
                         class="product-card-avatar" th:text="${#strings.substring(p.name, 0, 1)}"></div>
                    <div class="product-card-body">
                        <div class="product-card-name" th:text="${p.name}"></div>
                        <div class="product-card-stock"
                             th:text="${p.quantityInStock} + ' ' + ${p.unit ?: 'шт'}"
                             th:classappend="${p.quantityInStock.signum() <= 0} ? 'low-stock-row'"></div>
                    </div>
                </div>
            </div>
        </div>

        <p class="empty" th:if="${#lists.isEmpty(products)}">Товаров пока нет</p>
        <p class="empty" id="crm-product-empty" style="display:none">Ничего не найдено</p>
    </main>
</div>
<script th:inline="none">
    function crmFilterProducts() {
        var q = document.getElementById('crm-product-search').value.trim().toLowerCase();
        var totalVisible = 0;
        document.querySelectorAll('.category-section').forEach(function (section) {
            var visibleInSection = 0;
            section.querySelectorAll('.product-card').forEach(function (card) {
                var match = card.getAttribute('data-name').indexOf(q) !== -1;
                card.style.display = match ? '' : 'none';
                if (match) visibleInSection++;
            });
            section.style.display = visibleInSection > 0 ? '' : 'none';
            totalVisible += visibleInSection;
        });
        document.getElementById('crm-product-empty').style.display = totalVisible === 0 ? '' : 'none';
    }

    // Сортировка ВНУТРИ каждой категории (группировка по категориям сохраняется) — один
    // переключатель: по умолчанию количество по убыванию (самые большие остатки сверху),
    // клик -> количество по возрастанию, клик -> по названию, клик -> снова по умолчанию.
    var crmProductMode = 'qty_desc';
    function crmProductModeLabel(mode) {
        if (mode === 'qty_asc') return 'Количество ▲';
        if (mode === 'name_asc') return 'Название ▲';
        return 'Количество ▼';
    }
    function crmCycleProductSort() {
        crmProductMode = crmProductMode === 'qty_desc' ? 'qty_asc'
            : crmProductMode === 'qty_asc' ? 'name_asc' : 'qty_desc';
        crmApplyProductSort();
    }
    function crmApplyProductSort() {
        document.querySelectorAll('.product-grid').forEach(function (grid) {
            var cards = Array.prototype.slice.call(grid.querySelectorAll('.product-card'));
            cards.sort(function (a, b) {
                if (crmProductMode === 'name_asc') {
                    return a.getAttribute('data-name').localeCompare(b.getAttribute('data-name'), 'ru');
                }
                var diff = parseFloat(a.getAttribute('data-qty')) - parseFloat(b.getAttribute('data-qty'));
                return crmProductMode === 'qty_asc' ? diff : -diff;
            });
            cards.forEach(function (card) { grid.appendChild(card); });
        });
        var label = document.getElementById('crm-product-sort-label');
        if (label) label.textContent = crmProductModeLabel(crmProductMode);
    }
    crmApplyProductSort();
</script>
</body>
</html>
