<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Уведомления — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Уведомления</h1><p class="subtitle">Один заказ — одна карточка, полная история — по клику</p></div>
        </div>

        <div th:if="${not #lists.isEmpty(orderGroups)}">
            <details class="notif-group" th:each="g : ${orderGroups}">
                <summary>
                    <span class="summary-title" th:text="'Заказ №' + ${g.orderId} + ' (' + ${g.clientName} + ')'"></span>
                    <span class="summary-meta" th:text="${#lists.size(g.history)} + ' событ.'"></span>
                    <span class="badge" th:classappend="${g.status}" th:text="${g.statusLabel}"></span>
                </summary>
                <div class="history">
                    <div class="item" th:each="n : ${g.history}">
                        <div class="msg" th:text="${n.message}"></div>
                        <div class="when" th:text="${#temporals.format(n.createdAt, 'dd.MM.yyyy HH:mm')}"></div>
                    </div>
                </div>
            </details>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(orderGroups)}">Уведомлений по заказам пока нет</p>

        <div th:if="${not #lists.isEmpty(general)}" style="margin-top:24px">
            <h2>Прочие уведомления</h2>
            <div class="panel">
                <table>
                    <tr><th>Когда</th><th>Кому</th><th>Сообщение</th><th>Канал</th></tr>
                    <tr th:each="n : ${general}">
                        <td th:text="${#temporals.format(n.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                        <td th:text="${n.recipient}"></td>
                        <td th:text="${n.message}"></td>
                        <td th:text="${n.channel}"></td>
                    </tr>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
