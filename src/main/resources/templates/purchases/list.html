<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Покупки — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Покупки</h1><p class="subtitle">Закупки сырья у контрагентов — один контрагент может привезти сразу несколько товаров</p></div>
        </div>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form class="panel" th:action="@{/purchases}" method="post" style="max-width:720px" id="crmPurchaseForm">
            <h2>Новая закупка</h2>
            <div class="field">
                <label>Поставщик (контрагент)</label>
                <select name="counterpartyId" required>
                    <option value="">— выберите контрагента —</option>
                    <option th:each="c : ${counterparties}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
                <small th:if="${#lists.isEmpty(counterparties)}" style="color:var(--muted)">
                    Контрагентов пока нет — <a th:href="@{/counterparties}">добавьте на странице "Контрагенты"</a>.
                </small>
            </div>

            <h3 style="margin:16px 0 8px">Товары</h3>
            <div id="crmPurchaseRows">
                <div class="crm-purchase-row" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:10px">
                    <div class="field" style="flex:2;margin:0">
                        <label>Сырьё</label>
                        <input type="text" class="crm-purchase-search" placeholder="Начните вводить название..."
                               list="crmIngredientsList" autocomplete="off" required>
                        <input type="hidden" class="crm-purchase-id" name="ingredientId" required>
                    </div>
                    <div class="field" style="flex:1;margin:0">
                        <label>Количество</label>
                        <input type="number" step="0.001" min="0.001" class="crm-purchase-qty" name="quantity" required>
                    </div>
                    <div class="field" style="flex:1;margin:0">
                        <label>Сумма, ₸ (необязательно)</label>
                        <input type="number" step="0.01" min="0" name="totalPrice">
                    </div>
                    <button type="button" class="btn small" onclick="crmRemovePurchaseRow(this)" title="Убрать позицию" style="height:38px">×</button>
                </div>
            </div>
            <datalist id="crmIngredientsList">
                <option th:each="i : ${ingredients}"
                        th:value="${i.name} + ' (' + ${i.quantityInStock} + ' ' + ${i.unit} + ')'"
                        th:attr="data-id=${i.id}"></option>
            </datalist>
            <button class="btn small" type="button" onclick="crmAddPurchaseRow()" style="margin:4px 0 16px">+ Добавить товар</button>

            <div class="field" style="max-width:220px">
                <label>Дата</label>
                <input type="date" name="purchaseDate">
            </div>

            <button class="btn primary" type="submit" style="margin-top:8px">Оприходовать закупку</button>
        </form>

        <div class="panel">
            <h2>История закупок</h2>
            <form method="get" class="row" style="align-items:flex-end;margin-bottom:14px">
                <div class="field" style="margin:0">
                    <label>Дата</label>
                    <input type="date" name="date" th:value="${date}" th:disabled="${all}">
                </div>
                <button class="btn small" type="submit" th:if="${!all}">Найти</button>
                <a class="btn small" th:if="${!all}" th:href="@{/purchases(all=true)}">Показать все даты</a>
                <a class="btn small" th:if="${all}" th:href="@{/purchases}">Только сегодня</a>
            </form>
            <table th:if="${not #lists.isEmpty(purchases)}">
                <tr><th>Дата</th><th>Контрагент</th><th>Товары</th><th>Сумма</th><th>Кто</th><th>1С</th></tr>
                <tr th:each="p : ${purchases}">
                    <td th:text="${#temporals.format(p.purchaseDate, 'dd.MM.yyyy')}"></td>
                    <td th:text="${p.counterparty.name}"></td>
                    <td>
                        <span th:each="i, stat : ${p.items}">
                            <span th:text="${i.ingredient.name} + ' × ' + ${i.quantity} + ' ' + ${i.ingredient.unit}"></span><span th:if="${!stat.last}">, </span>
                        </span>
                    </td>
                    <td th:text="${p.totalSum} + ' ₸'"></td>
                    <td th:text="${p.createdBy}"></td>
                    <td>
                        <span th:if="${p.oneCDocumentNumber != null}" style="color:#4C8A5E" th:text="'№' + ${p.oneCDocumentNumber}"></span>
                        <span th:if="${p.oneCSyncError != null}" style="color:#B8433F" th:title="${p.oneCSyncError}">ошибка</span>
                    </td>
                </tr>
            </table>
            <p class="empty" th:if="${#lists.isEmpty(purchases)}">Закупок пока нет</p>
        </div>
    </main>
</div>
<script th:inline="none">
    function crmPurchaseWireRow(row) {
        var search = row.querySelector('.crm-purchase-search');
        var idField = row.querySelector('.crm-purchase-id');
        search.addEventListener('input', function () {
            var options = document.querySelectorAll('#crmIngredientsList option');
            var match = null;
            for (var i = 0; i < options.length; i++) {
                if (options[i].value === search.value) { match = options[i]; break; }
            }
            idField.value = match ? match.getAttribute('data-id') : '';
        });
    }

    function crmAddPurchaseRow() {
        var rows = document.getElementById('crmPurchaseRows');
        var clone = rows.querySelector('.crm-purchase-row').cloneNode(true);
        clone.querySelectorAll('input').forEach(function (el) { el.value = ''; });
        rows.appendChild(clone);
        crmPurchaseWireRow(clone);
    }

    function crmRemovePurchaseRow(btn) {
        var rows = document.getElementById('crmPurchaseRows');
        if (rows.querySelectorAll('.crm-purchase-row').length > 1) {
            btn.closest('.crm-purchase-row').remove();
        }
    }

    crmPurchaseWireRow(document.querySelector('.crm-purchase-row'));
</script>
</body>
</html>
