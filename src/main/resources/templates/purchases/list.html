<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Покупки — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Покупки</h1><p class="subtitle">Закупки сырья у поставщиков</p></div>
        </div>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form class="panel" th:action="@{/purchases}" method="post" style="max-width:560px">
            <h2>Новая закупка</h2>
            <div class="field">
                <label>Сырьё</label>
                <input type="text" id="crmPurchaseIngredientSearch" placeholder="Начните вводить название..."
                       list="crmIngredientsList" autocomplete="off" required
                       oninput="crmPurchaseIngredientPicked(this.value)">
                <input type="hidden" name="ingredientId" id="crmPurchaseIngredientId" required>
            </div>
            <datalist id="crmIngredientsList">
                <option th:each="i : ${ingredients}"
                        th:value="${i.name} + ' (' + ${i.quantityInStock} + ' ' + ${i.unit} + ')'"
                        th:attr="data-id=${i.id}"></option>
            </datalist>
            <div class="row">
                <div class="field">
                    <label>Количество</label>
                    <input type="number" step="0.001" min="0.001" name="quantity" required>
                </div>
                <div class="field">
                    <label>Поставщик</label>
                    <input type="text" name="supplier" required>
                </div>
            </div>
            <div class="row">
                <div class="field">
                    <label>Сумма закупки, ₸ (необязательно)</label>
                    <input type="number" step="0.01" min="0" name="totalPrice">
                </div>
                <div class="field">
                    <label>Дата</label>
                    <input type="date" name="purchaseDate">
                </div>
            </div>
            <button class="btn primary" type="submit">Оприходовать закупку</button>
        </form>

        <div class="panel">
            <h2>История закупок</h2>
            <form method="get" class="row" style="align-items:flex-end;margin-bottom:14px">
                <div class="field" style="margin:0">
                    <label>Дата</label>
                    <input type="date" name="date" th:value="${date}" th:disabled="${all}">
                </div>
                <button class="btn small" type="submit" th:if="${!all}">Найти</button>
                <a class="btn small" th:if="${!all}" th:href="@{/purchases(all=true)}">Показать все даты</a>
                <a class="btn small" th:if="${all}" th:href="@{/purchases}">Только сегодня</a>
            </form>
            <table th:if="${not #lists.isEmpty(purchases)}">
                <tr><th>Дата</th><th>Сырьё</th><th>Количество</th><th>Поставщик</th><th>Сумма</th><th>Кто</th></tr>
                <tr th:each="p : ${purchases}">
                    <td th:text="${#temporals.format(p.purchaseDate, 'dd.MM.yyyy')}"></td>
                    <td th:text="${p.ingredient.name}"></td>
                    <td th:text="${p.quantity} + ' ' + ${p.ingredient.unit}"></td>
                    <td th:text="${p.supplier}"></td>
                    <td th:text="${p.totalPrice != null ? p.totalPrice + ' ₸' : '—'}"></td>
                    <td th:text="${p.createdBy}"></td>
                </tr>
            </table>
            <p class="empty" th:if="${#lists.isEmpty(purchases)}">Закупок пока нет</p>
        </div>
    </main>
</div>
<script th:inline="none">
    function crmPurchaseIngredientPicked(value) {
        var options = document.querySelectorAll('#crmIngredientsList option');
        var idField = document.getElementById('crmPurchaseIngredientId');
        for (var i = 0; i < options.length; i++) {
            if (options[i].value === value) {
                idField.value = options[i].getAttribute('data-id');
                return;
            }
        }
        idField.value = '';
    }
</script>
</body>
</html>
