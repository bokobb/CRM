<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav" class="sidebar">
    <div class="brand"><img th:src="@{/images/logo.png}" alt="Логотип"> Юг Сладости</div>
    <a th:href="@{/}" class="nav-link" sec:authorize="!hasRole('WAREHOUSE_FG')" th:classappend="${activePage == 'dashboard'} ? 'active'">Дашборд</a>
    <a th:href="@{/clients}" class="nav-link" sec:authorize="hasAnyRole('ADMIN','ACCOUNTANT','SALES')" th:classappend="${activePage == 'clients'} ? 'active'">Клиенты</a>
    <a th:href="@{/products}" class="nav-link" sec:authorize="hasAnyRole('ADMIN','ACCOUNTANT','SALES')" th:classappend="${activePage == 'products'} ? 'active'">Товары и рецепты</a>
    <a th:href="@{/warehouse/stock}" class="nav-link" sec:authorize="hasAnyRole('ADMIN','ACCOUNTANT','WAREHOUSE_FG')" th:classappend="${activePage == 'warehouse-stock'} ? 'active'">Остатки</a>
    <a th:href="@{/ingredients}" class="nav-link" sec:authorize="hasAnyRole('ADMIN','ACCOUNTANT','WAREHOUSE_FG')" th:classappend="${activePage == 'ingredients'} ? 'active'">Сырьё</a>
    <a th:href="@{/orders}" class="nav-link" th:classappend="${activePage == 'orders'} ? 'active'">Заказы</a>
    <a th:href="@{/production}" class="nav-link" sec:authorize="hasAnyRole('ADMIN','ACCOUNTANT')" th:classappend="${activePage == 'production'} ? 'active'">Производство</a>
    <a th:href="@{/debts}" class="nav-link" sec:authorize="hasAnyRole('ADMIN','ACCOUNTANT')" th:classappend="${activePage == 'debts'} ? 'active'">Долги</a>
    <a th:href="@{/notifications}" class="nav-link" th:classappend="${activePage == 'notifications'} ? 'active'">Уведомления</a>
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)">
        <div sec:authentication="name" style="margin-bottom:8px"></div>
        <form th:action="@{/logout}" method="post" style="margin:0">
            <button class="btn small" type="submit" style="width:100%">Выйти</button>
        </form>
    </div>
</nav>
</body>
</html>
