<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Заказы из WhatsApp на уточнение</h1>
                <p class="subtitle">ИИ не смог уверенно распознать часть товаров — выберите их вручную, и в следующий раз система узнает это название сама</p></div>
        </div>

        <div class="panel">
            <table th:if="${not #lists.isEmpty(messages)}">
                <tr><th>Когда</th><th>Клиент</th><th>Телефон</th><th>Сообщение</th><th></th></tr>
                <tr th:each="m : ${messages}">
                    <td th:text="${#temporals.format(m.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${m.client.name}"></td>
                    <td th:text="${m.fromPhone}"></td>
                    <td th:text="${#strings.abbreviate(m.rawText, 60)}"></td>
                    <td><a class="btn small primary" th:href="@{/whatsapp-inbox/{id}(id=${m.id})}">Уточнить</a></td>
                </tr>
            </table>
            <p class="empty" th:if="${#lists.isEmpty(messages)}">Нет сообщений, ожидающих уточнения</p>
        </div>
    </main>
</div>
</body>
</html>
