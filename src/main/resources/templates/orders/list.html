<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Заказы — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Заказы</h1></div>
            <div>
                <a class="btn primary" th:href="@{/orders/new}">+ Новый заказ</a>
            </div>
        </div>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <div class="alert success" th:if="${success}" th:text="${success}"></div>

        <form class="date-range-form" method="get" th:action="@{/orders}" style="margin-bottom:14px">
            <input type="hidden" name="status" th:if="${selectedStatus != null}" th:value="${selectedStatus}">
            <input type="date" name="from" th:value="${rangeFrom}">
            <span>—</span>
            <input type="date" name="to" th:value="${rangeTo}">
            <button class="btn primary" type="submit">Показать</button>
            <a class="btn" th:href="@{/orders(status=${selectedStatus})}" th:if="${rangeFrom != null}">Все даты</a>
        </form>

        <div class="tabs">
            <a th:href="@{/orders(from=${rangeFrom}, to=${rangeTo})}" th:classappend="${selectedStatus == null} ? 'active'">Все</a>
            <a th:each="s : ${statuses}" th:href="@{/orders(status=${s}, from=${rangeFrom}, to=${rangeTo})}"
               th:classappend="${selectedStatus == s} ? 'active'" th:text="${s.label}"></a>
        </div>

        <div class="panel">
            <table th:if="${not #lists.isEmpty(orders)}">
                <tr><th>№</th><th>Клиент</th><th>Дата</th><th>Срок</th><th>Статус</th><th>Сумма</th><th></th><th></th></tr>
                <tr th:each="o : ${orders}">
                    <td th:text="'#' + ${o.id}"></td>
                    <td>
                        <span th:text="${o.client.name}"></span>
                        <svg th:if="${o.fromWhatsapp}" title="Заказ из WhatsApp" width="14" height="14" viewBox="0 0 24 24"
                             style="vertical-align:-2px;margin-left:4px" fill="#25D366">
                            <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.42-1.42a9.87 9.87 0 0 0 4.62 1.18h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.11c-.24.68-1.4 1.3-1.93 1.35-.5.06-1.02.27-3.42-.71-2.9-1.19-4.76-4.14-4.9-4.33-.14-.19-1.17-1.55-1.17-2.96s.73-2.1.99-2.39c.26-.28.56-.35.75-.35h.53c.17 0 .4-.03.62.47.24.55.81 1.9.88 2.04.07.14.11.3.02.49-.09.19-.14.3-.28.46-.14.16-.29.36-.42.48-.14.13-.28.28-.12.55.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.19-.28.37-.23.62-.14.26.09 1.63.77 1.91.91.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/>
                        </svg>
                    </td>
                    <td th:text="${#temporals.format(o.createdAt, 'dd.MM.yyyy')}"></td>
                    <td th:text="${o.dueDate != null ? #temporals.format(o.dueDate, 'dd.MM.yyyy') : '—'}"></td>
                    <td><span class="badge" th:classappend="${o.status}" th:text="${o.status.label}"></span></td>
                    <td th:text="${o.totalPrice} + ' ₸'"></td>
                    <td>
                        <span class="badge CANCELLED" th:if="${o.debtDueDate != null and o.debtPaid != true}">Долг</span>
                    </td>
                    <td><a class="btn small" th:href="@{/orders/{id}(id=${o.id})}">Открыть</a></td>
                </tr>
            </table>
            <p class="empty" th:if="${#lists.isEmpty(orders)}">Заказов не найдено</p>
        </div>
    </main>
</div>
</body>
</html>
