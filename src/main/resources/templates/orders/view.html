<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Заказ #' + ${order.id} + ' — Юг Сладости'">Заказ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div>
                <h1>
                    Заказ #<span th:text="${order.id}"></span>
                    <svg th:if="${order.fromWhatsapp}" title="Заказ из WhatsApp" width="18" height="18" viewBox="0 0 24 24"
                         style="vertical-align:-3px;margin-left:6px" fill="#25D366">
                        <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.42-1.42a9.87 9.87 0 0 0 4.62 1.18h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.11c-.24.68-1.4 1.3-1.93 1.35-.5.06-1.02.27-3.42-.71-2.9-1.19-4.76-4.14-4.9-4.33-.14-.19-1.17-1.55-1.17-2.96s.73-2.1.99-2.39c.26-.28.56-.35.75-.35h.53c.17 0 .4-.03.62.47.24.55.81 1.9.88 2.04.07.14.11.3.02.49-.09.19-.14.3-.28.46-.14.16-.29.36-.42.48-.14.13-.28.28-.12.55.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.19-.28.37-.23.62-.14.26.09 1.63.77 1.91.91.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/>
                    </svg>
                </h1>
                <p class="subtitle">
                    <a th:href="@{/clients/{id}(id=${order.client.id})}" th:text="${order.client.name}">Клиент</a>
                    · создан <span th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
                    <span th:if="${order.dueDate != null}"> · срок <span th:text="${#temporals.format(order.dueDate, 'dd.MM.yyyy')}"></span></span>
                </p>
            </div>
            <span class="badge" th:classappend="${order.status}" th:text="${order.status.label}" style="font-size:14px"></span>
        </div>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <div class="panel actions">
            <form th:if="${order.status.name() == 'NEW'}" th:action="@{/orders/{id}/confirm(id=${order.id})}" method="post">
                <button class="btn primary" type="submit">Подтвердить (готов к отгрузке)</button>
            </form>
            <form th:if="${order.status.name() == 'READY'}" th:action="@{/orders/{id}/deliver(id=${order.id})}" method="post">
                <input type="text" name="vehicleNumber" placeholder="Гос. номер ТС" required>
                <button class="btn primary" type="submit">Отгрузил</button>
            </form>
            <form th:if="${order.status.name() == 'NEW' or order.status.name() == 'IN_PRODUCTION' or order.status.name() == 'READY'}"
                  th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" onsubmit="return confirm('Отменить заказ?');">
                <button class="btn danger" type="submit">Отменить заказ</button>
            </form>
            <form th:if="${order.status.name() == 'DELIVERED'}" th:action="@{/orders/{id}/complete(id=${order.id})}" method="post">
                <button class="btn primary" type="submit"
                        th:text="${order.debtDueDate != null and order.debtPaid != true} ? 'Оплачено, завершить' : 'Завершить заказ'">Завершить заказ</button>
            </form>
            <form th:if="${order.status.name() == 'DELIVERED' and (order.debtDueDate == null or order.debtPaid == true)}"
                  th:action="@{/orders/{id}/debt(id=${order.id})}" method="post" style="display:flex;gap:6px;align-items:center">
                <input type="date" name="dueDate" required>
                <button class="btn" type="submit">Долг</button>
            </form>
        </div>

        <div class="alert warn" th:if="${order.debtDueDate != null and order.debtPaid != true}">
            Долг до <span th:text="${#temporals.format(order.debtDueDate, 'dd.MM.yyyy')}"></span>
        </div>

        <div class="alert success" th:if="${order.oneCDocumentNumber != null}">
            В 1С создан непроведённый документ реализации № <span th:text="${order.oneCDocumentNumber}"></span>
        </div>
        <div class="alert warn" th:if="${order.oneCSyncError != null}">
            Не выгружен в 1С: <span th:text="${order.oneCSyncError}"></span>
        </div>

        <div class="grid cols-2">
            <div class="panel">
                <h2>Состав заказа</h2>
                <table>
                    <tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr>
                    <tr th:each="i : ${order.items}">
                        <td th:text="${i.product.name}"></td>
                        <td th:text="${i.quantity}"></td>
                        <td th:text="${i.price} + ' ₸'"></td>
                        <td th:text="${i.price * i.quantity} + ' ₸'"></td>
                    </tr>
                    <tr>
                        <td colspan="3"><strong>Итого</strong></td>
                        <td><strong th:text="${order.totalPrice} + ' ₸'"></strong></td>
                    </tr>
                </table>
                <p th:if="${order.notes}" style="margin-top:12px;color:var(--muted)" th:text="${order.notes}"></p>
                <p th:if="${order.vehicleNumber}" style="margin-top:12px">
                    <strong>Отгружено:</strong> ТС <span th:text="${order.vehicleNumber}"></span>
                    · <span th:text="${#temporals.format(order.shippedAt, 'dd.MM.yyyy HH:mm')}"></span>
                    · <span th:text="${order.shippedByName}"></span>
                </p>
            </div>

            <div class="panel">
                <h2>Задачи цеха</h2>
                <table th:if="${not #lists.isEmpty(order.productionTasks)}">
                    <tr><th>Товар</th><th>Кол-во</th><th>Статус</th></tr>
                    <tr th:each="t : ${order.productionTasks}">
                        <td th:text="${t.product.name}"></td>
                        <td th:text="${t.quantity}"></td>
                        <td><span class="badge" th:classappend="${t.status}" th:text="${t.status.label}"></span></td>
                    </tr>
                </table>
                <p class="empty" th:if="${#lists.isEmpty(order.productionTasks)}">Задачи появятся после подтверждения заказа</p>
                <a class="btn small" th:if="${not #lists.isEmpty(order.productionTasks)}" th:href="@{/production}">Открыть доску производства</a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
