<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Долги — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Долги</h1><p class="subtitle">Заказы, по которым клиент ещё не оплатил</p></div>
        </div>

        <div class="panel">
            <table th:if="${not #lists.isEmpty(debts)}">
                <tr><th>№</th><th>Клиент</th><th>Сумма</th><th>Срок оплаты</th><th></th></tr>
                <tr th:each="o : ${debts}">
                    <td th:text="'#' + ${o.id}"></td>
                    <td th:text="${o.client.name}"></td>
                    <td th:text="${o.totalPrice} + ' ₸'"></td>
                    <td>
                        <span th:classappend="${o.debtDueDate.isBefore(T(java.time.LocalDate).now())} ? 'low-stock-row'"
                              th:text="${#temporals.format(o.debtDueDate, 'dd.MM.yyyy')}"></span>
                        <span class="badge CANCELLED" th:if="${o.debtDueDate.isBefore(T(java.time.LocalDate).now())}">Просрочен</span>
                    </td>
                    <td><a class="btn small" th:href="@{/orders/{id}(id=${o.id})}">Открыть</a></td>
                </tr>
            </table>
            <p class="empty" th:if="${#lists.isEmpty(debts)}">Неоплаченных долгов нет</p>
        </div>
    </main>
</div>
</body>
</html>
