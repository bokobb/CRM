<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Производство — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Производство</h1><p class="subtitle">Заявки на сырьё по стадиям — от создания до оприходования</p></div>
        </div>

        <div class="board">
            <div class="board-col">
                <h2>Ожидает <span th:text="${#lists.size(pending)}"></span></h2>
                <a class="task-card" th:each="r : ${pending}" th:href="@{/production-requests/{id}(id=${r.id})}">
                    <div class="title" th:text="${r.title}"></div>
                    <div class="meta" th:text="${#strings.arrayJoin(r.productNames.toArray(), ', ')} + ' · ' + ${r.totalBatches} + ' замес.'"></div>
                    <div class="meta" th:text="${r.createdBy} + ' · ' + ${#temporals.format(r.createdAt, 'dd.MM.yyyy HH:mm')}"></div>
                </a>
                <p class="empty" th:if="${#lists.isEmpty(pending)}">Пусто</p>
            </div>

            <div class="board-col">
                <h2>В работе <span th:text="${#lists.size(inProgress)}"></span></h2>
                <a class="task-card" th:each="r : ${inProgress}" th:href="@{/production-requests/{id}(id=${r.id})}">
                    <div class="title" th:text="${r.title}"></div>
                    <div class="meta" th:text="${#strings.arrayJoin(r.productNames.toArray(), ', ')} + ' · ' + ${r.totalBatches} + ' замес.'"></div>
                    <div class="meta" th:text="'Собрана — ждёт оприходования'"></div>
                </a>
                <p class="empty" th:if="${#lists.isEmpty(inProgress)}">Пусто</p>
            </div>

            <div class="board-col">
                <h2>Готово <span th:text="${#lists.size(done)}"></span></h2>
                <a class="task-card" th:each="r : ${done}" th:href="@{/production-requests/{id}(id=${r.id})}">
                    <div class="title" th:text="${r.title}"></div>
                    <div class="meta" th:text="${#strings.arrayJoin(r.productNames.toArray(), ', ')} + ' · ' + ${r.totalBatches} + ' замес.'"></div>
                    <div class="meta" th:text="${r.createdBy} + ' · ' + ${#temporals.format(r.createdAt, 'dd.MM.yyyy HH:mm')}"></div>
                </a>
                <p class="empty" th:if="${#lists.isEmpty(done)}">Пусто</p>
            </div>
        </div>
    </main>
</div>
</body>
</html>
