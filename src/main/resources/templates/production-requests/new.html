<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новая заявка на сырьё — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <h1>Новая заявка на сырьё</h1>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form class="panel" th:action="@{/production-requests}" method="post" style="max-width:480px">
            <div class="field">
                <label>Товар</label>
                <select name="productId" required>
                    <option value="">— выберите товар —</option>
                    <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option>
                </select>
            </div>
            <div class="field">
                <label>Количество замесов</label>
                <input type="number" step="0.001" min="0.001" name="batches" required>
            </div>
            <button class="btn primary" type="submit">Создать заявку</button>
        </form>

        <p class="empty" th:if="${#lists.isEmpty(products)}">
            Нет ни одного товара с заполненной рецептурой — сначала добавьте рецептуру на странице товара.
        </p>
    </main>
</div>
</body>
</html>
