<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Редактировать заявку №' + ${request.id} + ' — Юг Сладости'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <h1>Редактировать заявку №<span th:text="${request.id}"></span> «<span th:text="${request.title}"></span>»</h1>
        <p class="subtitle">Название заявки не меняется — оно определилось по группе товара при
            создании. Замесы и штуки пересчитываются друг в друга сами.</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form class="panel" th:action="@{/production-requests/{id}/edit(id=${request.id})}" method="post" style="max-width:720px" id="crmProdForm">
            <div class="field" style="max-width:220px">
                <label>Дата документа (для 1С)</label>
                <input type="date" name="documentDate" th:value="${request.documentDate}">
            </div>
            <div id="crmProdRows">
                <div class="crm-prod-row" th:each="l : ${request.lines}" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:10px">
                    <div class="field" style="flex:2;margin:0">
                        <label>Товар</label>
                        <input type="text" class="crm-prod-search" th:value="${l.product.name}" placeholder="Начните вводить название..."
                               list="crmProductsList" autocomplete="off">
                        <input type="hidden" class="crm-prod-id" name="productId" th:value="${l.product.id}" required>
                        <small class="crm-prod-group" th:text="'Группа: ' + (${l.product.group} ?: 'Без группы')" style="color:var(--muted)"></small>
                    </div>
                    <div class="field" style="flex:1;margin:0">
                        <label>Замесов</label>
                        <input type="number" step="0.001" min="0.001" class="crm-prod-batches" name="batches" th:value="${l.batches}" required>
                    </div>
                    <div class="field" style="flex:1;margin:0">
                        <label>Штук/кг</label>
                        <input type="number" step="0.001" min="0" class="crm-prod-qty">
                    </div>
                    <button type="button" class="btn small" onclick="crmRemoveRow(this)" title="Убрать позицию" style="height:38px">×</button>
                </div>
            </div>
            <datalist id="crmProductsList">
                <option th:each="r : ${recipes}" th:value="${r.product.name}"
                        th:attr="data-id=${r.product.id},data-yield=${r.yieldQuantity},data-unit=${r.product.unit ?: 'шт'},data-group=${r.product.group ?: 'Без группы'}"></option>
            </datalist>

            <button class="btn small" type="button" onclick="crmAddRow()" style="margin:4px 0 16px">+ Добавить позицию</button>
            <p class="subtitle" id="crmProdTotal" style="margin:0 0 12px"></p>
            <div class="actions">
                <button class="btn primary" type="submit">Сохранить</button>
                <a class="btn" th:href="@{/production-requests/{id}(id=${request.id})}">Отмена</a>
            </div>
        </form>
    </main>
</div>
<script th:inline="none">
    function crmProductByName(name) {
        var options = document.querySelectorAll('#crmProductsList option');
        for (var i = 0; i < options.length; i++) {
            if (options[i].value === name) return options[i];
        }
        return null;
    }

    function crmWireRow(row) {
        var search = row.querySelector('.crm-prod-search');
        var idField = row.querySelector('.crm-prod-id');
        var batches = row.querySelector('.crm-prod-batches');
        var qty = row.querySelector('.crm-prod-qty');
        var groupHint = row.querySelector('.crm-prod-group');

        function currentYield() {
            var opt = crmProductByName(search.value);
            return opt ? parseFloat(opt.getAttribute('data-yield')) : null;
        }

        search.addEventListener('input', function () {
            var opt = crmProductByName(search.value);
            idField.value = opt ? opt.getAttribute('data-id') : '';
            groupHint.textContent = opt ? ('Группа: ' + opt.getAttribute('data-group')) : '';
        });
        batches.addEventListener('input', function () {
            var y = currentYield();
            if (y && batches.value !== '') qty.value = (parseFloat(batches.value) * y).toFixed(3).replace(/\.?0+$/, '');
        });
        qty.addEventListener('input', function () {
            var y = currentYield();
            if (y && qty.value !== '') batches.value = (parseFloat(qty.value) / y).toFixed(3).replace(/\.?0+$/, '');
        });
    }

    function crmAddRow() {
        var rows = document.getElementById('crmProdRows');
        var clone = rows.querySelector('.crm-prod-row').cloneNode(true);
        clone.querySelectorAll('input').forEach(function (el) { el.value = ''; });
        clone.querySelector('.crm-prod-group').textContent = '';
        rows.appendChild(clone);
        crmWireRow(clone);
    }

    function crmRemoveRow(btn) {
        var rows = document.getElementById('crmProdRows');
        if (rows.querySelectorAll('.crm-prod-row').length > 1) {
            btn.closest('.crm-prod-row').remove();
        }
    }

    document.querySelectorAll('.crm-prod-row').forEach(crmWireRow);
</script>
</body>
</html>
