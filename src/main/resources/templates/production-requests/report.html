<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Отчёт по производству — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div>
                <h1>Отчёт по производству</h1>
                <p class="subtitle" th:if="${all}">Норма по рецепту, факт оприходования и отклонение — за всё время</p>
                <p class="subtitle" th:if="${!all and from == to}"
                   th:text="'Норма по рецепту, факт оприходования и отклонение — за ' + ${#temporals.format(from, 'dd.MM.yyyy')}"></p>
                <p class="subtitle" th:if="${!all and from != to}"
                   th:text="'Норма по рецепту, факт оприходования и отклонение — с ' + ${#temporals.format(from, 'dd.MM.yyyy')} + ' по ' + ${#temporals.format(to, 'dd.MM.yyyy')}"></p>
            </div>
        </div>

        <div class="panel">
            <form method="get" class="row" style="align-items:flex-end;margin-bottom:14px">
                <div class="field" style="margin:0">
                    <label>С даты</label>
                    <input type="date" name="from" th:value="${from}" th:disabled="${all}">
                </div>
                <div class="field" style="margin:0">
                    <label>По дату</label>
                    <input type="date" name="to" th:value="${to}" th:disabled="${all}">
                </div>
                <button class="btn small" type="submit" th:if="${!all}">Показать</button>
                <a class="btn small" th:if="${!all}" th:href="@{/production-requests/report(all=true)}">Показать все даты</a>
                <a class="btn small" th:if="${all}" th:href="@{/production-requests/report}">Только сегодня</a>
                <a class="btn small" th:href="@{/production-requests/report/pdf(from=${from},to=${to},all=${all})}">Скачать PDF целиком</a>
            </form>

            <table th:if="${not #lists.isEmpty(lines)}">
                <tr><th>№</th><th>Товар</th><th>Замесов</th><th>Норма</th><th>Факт</th><th>Отклонение</th><th>Ед.</th><th>Оприходований</th></tr>
                <tr th:each="l, iter : ${lines}">
                    <td th:text="${iter.count}"></td>
                    <td th:text="${l.productName}"></td>
                    <td th:text="${l.batches}"></td>
                    <td th:text="${l.norm}"></td>
                    <td th:text="${l.received}"></td>
                    <td th:style="${l.deviation.signum() < 0 ? 'color:#c0392b' : (l.deviation.signum() > 0 ? 'color:#27ae60' : '')}"
                        th:text="${(l.deviation.signum() > 0 ? '+' : '') + l.deviation}"></td>
                    <td th:text="${l.unit}"></td>
                    <td th:text="${l.receivedCount}"></td>
                </tr>
            </table>
            <p class="empty" th:if="${#lists.isEmpty(lines)}">За этот период ничего не оприходовано</p>
        </div>
    </main>
</div>
</body>
</html>
