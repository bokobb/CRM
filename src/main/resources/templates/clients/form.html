<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Клиент — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <h1 th:text="${client.id} != null ? 'Редактировать клиента' : 'Новый клиент'">Клиент</h1>

        <form class="panel" th:action="@{/clients}" th:object="${client}" method="post" style="max-width:520px">
            <input type="hidden" th:field="*{id}">
            <div class="field">
                <label>Имя</label>
                <input type="text" th:field="*{name}" required>
            </div>
            <div class="row">
                <div class="field">
                    <label>Телефон</label>
                    <input type="tel" th:field="*{phone}">
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" th:field="*{email}">
                </div>
            </div>
            <div class="field">
                <label>Адрес</label>
                <input type="text" th:field="*{address}">
            </div>
            <div class="field">
                <label>Заметки</label>
                <textarea th:field="*{notes}"></textarea>
            </div>
            <div class="actions">
                <button class="btn primary" type="submit">Сохранить</button>
                <a class="btn" th:href="@{/clients}">Отмена</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
