<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Клиенты — Юг Сладости</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Клиенты</h1></div>
            <div>
                <form method="post" th:action="@{/clients/link-1c}" sec:authorize="hasRole('ADMIN')" style="display:inline">
                    <button type="submit" class="btn">Привязать к 1С по имени</button>
                </form>
                <form method="post" th:action="@{/clients/prices-1c}" sec:authorize="hasRole('ADMIN')" style="display:inline">
                    <button type="submit" class="btn">Обновить цены из 1С</button>
                </form>
                <a class="btn primary" th:href="@{/clients/new}">+ Новый клиент</a>
            </div>
        </div>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <div class="alert success" th:if="${success}" th:text="${success}"></div>

        <input type="text" id="crm-client-search" class="product-search"
               placeholder="Поиск по имени или телефону…" oninput="crmFilterClients()"
               th:if="${not #lists.isEmpty(clients)}">

        <div class="panel">
            <table th:if="${not #lists.isEmpty(clients)}">
                <tr><th>Имя</th><th>Телефон</th><th>Email</th><th>Адрес</th><th></th></tr>
                <tr th:each="c : ${clients}"
                    th:attr="data-name=${#strings.toLowerCase(c.name)} + ' ' + ${#strings.toLowerCase(c.phone ?: '')}">
                    <td>
                        <div class="client-row">
                            <div class="client-avatar" th:text="${#strings.substring(c.name, 0, 1)}"></div>
                            <a th:href="@{/clients/{id}(id=${c.id})}" th:text="${c.name}">Имя</a>
                        </div>
                    </td>
                    <td th:text="${c.phone}"></td>
                    <td th:text="${c.email}"></td>
                    <td th:text="${c.address}"></td>
                    <td class="actions">
                        <a class="btn small" th:href="@{/clients/{id}/edit(id=${c.id})}">Изменить</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/clients/{id}/delete(id=${c.id})}" method="post"
                              onsubmit="return confirm('Удалить клиента вместе со всеми его заказами и историей? Это необратимо.');">
                            <button class="btn small danger" type="submit">Удалить</button>
                        </form>
                    </td>
                </tr>
            </table>
            <p class="empty" th:if="${#lists.isEmpty(clients)}">Клиентов пока нет</p>
            <p class="empty" id="crm-client-empty" style="display:none">Ничего не найдено</p>
        </div>
    </main>
</div>
<script th:inline="none">
    function crmFilterClients() {
        var q = document.getElementById('crm-client-search').value.trim().toLowerCase();
        var rows = document.querySelectorAll('table tr[data-name]');
        var visible = 0;
        rows.forEach(function (row) {
            var match = row.getAttribute('data-name').indexOf(q) !== -1;
            row.style.display = match ? '' : 'none';
            if (match) visible++;
        });
        document.getElementById('crm-client-empty').style.display = visible === 0 ? '' : 'none';
    }
</script>
</body>
</html>
