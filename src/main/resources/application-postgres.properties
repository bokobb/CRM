# Профиль для продакшена: PostgreSQL (см. docker-compose.yml)
# Запуск: ./gradlew bootRun --args='--spring.profiles.active=postgres'

spring.datasource.url=jdbc:postgresql://localhost:5434/crm
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=crm
spring.datasource.password=crm

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

# Продакшен работает с реальными данными — демо-заполнение (см. DataSeeder) не нужно.
crm.seed-demo-data=false
