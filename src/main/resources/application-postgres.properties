# Профиль для продакшена: PostgreSQL (см. docker-compose.yml)
# Запуск: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres

spring.datasource.url=jdbc:postgresql://localhost:5432/crm
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=crm
spring.datasource.password=crm

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false
