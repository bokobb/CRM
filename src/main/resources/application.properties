spring.application.name=crm

# --- Default profile: H2 file-based DB, no external services required ---
spring.datasource.url=jdbc:h2:file:./data/crm;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Включено осознанно: страницы — server-rendered Thymeleaf-шаблоны, которые лениво
# обращаются к связанным сущностям (client, product и т.д.) прямо при рендеринге.
spring.jpa.open-in-view=true

# Демо-данные создаются только при первом запуске (пустая БД)
crm.seed-demo-data=true

# Папка для загруженных фото товаров (см. FileStorageService) — раздаётся статически по
# /product-images/** (UploadConfig). Отдельно от ./data/crm (БД), чтобы не мешать бэкапу БД.
crm.uploads.dir=./data/product-images
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Бинарь cwebp (статически собран, без sudo — см. FileStorageService.tryConvertToWebp)
# для перекодирования загруженных JPEG/PNG в WebP: экономия ~85-90% размера на реальных
# фото товаров. Если бинаря нет по этому пути — конвертация просто не выполняется, загрузка
# фото не ломается (сохраняется в исходном формате).
crm.uploads.cwebp-path=${CWEBP_PATH:/home/b-o-k-obb/tools/cwebp}

# Порог автоматической проверки остатков склада (см. ScheduledJobs)
crm.stock.low-stock-check-cron=0 0 * * * *

# Проверка просроченных долгов (см. ScheduledJobs.checkOverdueDebts) — раз в день в 9:00
crm.debts.overdue-check-cron=0 0 9 * * *

# Почта не настроена по умолчанию — NotificationService просто логирует уведомления.
# Хост нужен только чтобы Spring создал бин JavaMailSender; реальная отправка
# включается флагом crm.notifications.email-enabled и требует настоящих SMTP-настроек.
spring.mail.host=localhost
crm.notifications.email-enabled=false

# Секрет для подписи JWT мобильного REST API (/api/**). Дефолт годится только для
# локальной разработки за NAT/Tailscale — как только backend выставлен в интернет
# (домен + HTTPS), ОБЯЗАТЕЛЬНО переопределить переменной окружения JWT_SECRET
# случайным значением (например: openssl rand -base64 48), иначе токены можно подделать.
crm.jwt.secret=${JWT_SECRET:change-me-crm-jwt-dev-secret-please-override-in-prod-min-32-bytes}
crm.jwt.expiration-minutes=720

# --- Приём заказов из WhatsApp (см. WhatsAppWebhookController, WhatsAppOrderIntakeService) ---
# Движок распознавания заказа: "claude" (платно, точнее на сленге/опечатках, см.
# ClaudeOrderParserService) или "ollama" (бесплатно, но требует локальный GPU-сервер —
# не используется на этой инсталляции/при деплое, см. OllamaOrderParserService).
# Дефолт "claude", т.к. Ollama сейчас не разворачивается (нет своего сервера с GPU в облаке);
# переопределяется переменной окружения на случай, если Ollama снова понадобится локально.
crm.order-parser.engine=${ORDER_PARSER_ENGINE:claude}

# Локальная модель через Ollama (ollama serve, см. environment-quirks про установку без sudo)
# — актуально, только если crm.order-parser.engine=ollama (сейчас не используется).
crm.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
crm.ollama.model=${OLLAMA_MODEL:qwen2.5:7b}

# Ключ Claude API — используется только если crm.order-parser.engine=claude.
# Пусто по умолчанию: пока не задан, распознавание заказов из WhatsApp просто не работает
# (админу и клиенту уходит сообщение об ошибке настройки), остальной функционал не затронут.
crm.claude.api-key=${CLAUDE_API_KEY:}
crm.claude.model=claude-sonnet-5
# Адрес Node.js-шлюза WhatsApp (см. whatsapp-gateway/) и общий секрет для вебхука между
# шлюзом и бэкендом (не JWT — шлюз не является пользователем CRM).
crm.whatsapp.gateway-url=${WHATSAPP_GATEWAY_URL:http://localhost:3001}
crm.whatsapp.webhook-secret=${WHATSAPP_WEBHOOK_SECRET:}

# --- Синхронизация остатков из 1С:Fresh (см. OneCClient/OneCStockSyncService) ---
# Read-only: CRM только читает остатки из 1С, никогда не пишет туда. Пусто по умолчанию —
# пока не заданы base-url/username/password, синхронизация просто не работает (как Firebase/email).
crm.onec.base-url=${ONEC_BASE_URL:}
crm.onec.username=${ONEC_USERNAME:}
crm.onec.password=${ONEC_PASSWORD:}
crm.onec.sync-cron=0 */5 * * * *
# Коды счетов плана счетов 1С (Готовая продукция / Сырье и материалы) и Ref_Key складов —
# значения по умолчанию соответствуют реальной базе клиента на момент настройки интеграции.
crm.onec.finished-goods-account-code=1320
crm.onec.materials-account-code=1310
crm.onec.finished-goods-warehouse-key=d2791a64-4f43-11f1-9670-5254007c5efd
crm.onec.materials-warehouse-key=ca2e388a-4f43-11f1-9670-5254007c5efd

# --- Выгрузка заказов в 1С непроведённым документом "Реализация товаров и услуг" (см.
# OneCOrderSyncService) — единственная запись в 1С среди всей интеграции. Значения ниже —
# константы шапки документа, общие для всех заказов (организация, валюта и т.д.), подобраны
# по образцу реального документа в базе клиента; Контрагент/Договор берутся из привязки
# клиента (Client.oneCContragentKey/oneCContractKey), Склад — тот же, что и для остатков
# готовой продукции выше. ТипЦен_Key НЕ константа — в этой базе у каждого клиента свой именной
# тип цен (см. OneCClientPriceSyncService/Client.oneCPriceTypeKey), поэтому здесь не задаётся.
crm.onec.organization-key=97dc77d2-e4a6-11f0-8ef7-5254007c5efd
crm.onec.currency-key=7b6f9374-e49a-11f0-8ef7-5254007c5efd
crm.onec.tax-accounting-type-key=4ec9ba8a-2194-11f0-8d3d-5254008b6ccf
crm.onec.advance-account-key=7b946b40-e49a-11f0-8ef7-5254007c5efd
crm.onec.settlement-account-key=7b944368-e49a-11f0-8ef7-5254007c5efd
# Раз в сутки в 20:00 — автооприходование ГП (см. OneCReceiptSyncService.scheduledPostDailyReceipts),
# единственный, кто теперь пользуется этой настройкой. Прежний общий будильник, который в это же
# время проводил документы заказов и заявок на производство, убран целиком. Заказы ("Реализация")
# CRM больше вообще не проводит — через OData это не формировало движений по складу, теперь
# бухгалтер проводит их вручную прямо в 1С. Отчёт производства проводится автоматически сразу
# при полном оприходовании заявки (OneCProductionSyncService.tryPostReport), а требование-накладную
# проводит вручную кнопка "Завершить" (OneCProductionSyncService.postRequisition).
crm.onec.post-cron=0 0 20 * * *
# "Приходная" — единственный, не привязанный к клиенту тип цен, используется в шапке
# сводного документа "Оприходование товаров" (см. OneCReceiptSyncService).
crm.onec.receipt-price-type-key=9a6a136a-e4a6-11f0-8ef7-5254007c5efd

# --- Выгрузка заявок на производство парой документов "Отчёт производства за смену" +
# "Требование-накладная" (см. OneCProductionSyncService) — счета учёта готовой продукции те
# же, что у "Реализации"/"Оприходования" выше, но здесь не подбираются по образцу продажи
# (свой сервис, без синхронизации с line-template других сервисов), поэтому продублированы
# явными константами.
crm.onec.finished-goods-account-bu-key=7b94471e-e49a-11f0-8ef7-5254007c5efd
crm.onec.finished-goods-account-nu-key=803c5e0a-e49a-11f0-8ef7-5254007c5efd
crm.onec.materials-account-bu-key=7b9446ec-e49a-11f0-8ef7-5254007c5efd
crm.onec.production-cost-account-bu-key=7b94835a-e49a-11f0-8ef7-5254007c5efd
crm.onec.production-cost-account-nu-key=803c764c-e49a-11f0-8ef7-5254007c5efd
crm.onec.production-department-key=778f254e-66ef-11f1-82c6-5254007c5efd
crm.onec.production-cost-item-key=8de4edf6-e49a-11f0-8ef7-5254007c5efd
# "Плановая" — тип цен для поля "ПлановаяСтоимость" строк "Продукция" отчёта производства (см.
# OneCProductionSyncService.fetchPlannedPrices). На момент подключения (2026-09-19) в 1С по этому
# типу цен ещё не заведено ни одной записи — поле будет 0, пока бухгалтер не внесёт плановые цены
# в 1С (Тип цен "Плановая" в справочнике "Типы цен номенклатуры").
crm.onec.planned-price-type-key=9938bf46-e4a6-11f0-8ef7-5254007c5efd
# Запасной вариант для НоменклатурнаяГруппа_Key, когда у самого товара в 1С группа не задана
# (обнаружено на "Пряник"/"Орешки со сгущенкой шарики") — "Основная номенклатурная группа",
# специально предусмотренная в этой базе 1С для таких случаев (см. OneCProductionSyncService.sync).
crm.onec.default-nomenclature-group-key=8ebc0516-e49a-11f0-8ef7-5254007c5efd
