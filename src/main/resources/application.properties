spring.application.name=crm

# --- Default profile: H2 file-based DB, no external services required ---
spring.datasource.url=jdbc:h2:file:./data/crm;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Включено осознанно: страницы — server-rendered Thymeleaf-шаблоны, которые лениво
# обращаются к связанным сущностям (client, product и т.д.) прямо при рендеринге.
spring.jpa.open-in-view=true

# Демо-данные создаются только при первом запуске (пустая БД)
crm.seed-demo-data=true

# Порог автоматической проверки остатков склада (см. ScheduledJobs)
crm.stock.low-stock-check-cron=0 0 * * * *

# Почта не настроена по умолчанию — NotificationService просто логирует уведомления.
# Хост нужен только чтобы Spring создал бин JavaMailSender; реальная отправка
# включается флагом crm.notifications.email-enabled и требует настоящих SMTP-настроек.
spring.mail.host=localhost
crm.notifications.email-enabled=false
